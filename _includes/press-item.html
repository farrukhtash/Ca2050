<a class="press-item" href="{{ include.item.url }}" target="_blank" rel="noopener">
  <span class="p-icon">{% case include.item.type %}{% when 'youtube' %}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="M10 9l5 3-5 3z" fill="currentColor" stroke="none"/></svg>{% when 'telegram' %}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>{% else %}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>{% endcase %}</span>
  <span class="p-body">
    <span class="p-source">{{ include.item.source }}</span>
    <span class="p-title">{{ include.item.title }}</span>
  </span>
  {% if include.item.date and include.item.date != "" %}<span class="p-date">{{ include.item.date }}</span>{% endif %}
  <span class="p-arrow">↗</span>
</a>
