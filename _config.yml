title: "Марказий Осиё давлатлари 2050 — Минтақавий форсайт-мулоқот"
description: "Минтақавий форсайт-мулоқот натижаси — 2050 йилгача бўлган келажак манзаралари"
url: "https://ca2050.uz"

footer_uz: "Марказий Осиё давлатлари 2050 — Минтақавий форсайт-мулоқот · Тошкент, 2026"
footer_en: "Central Asia States 2050 — Regional Foresight Dialogue · Tashkent, 2026"

markdown: kramdown

# ── Multilingual (jekyll-polyglot) ──────────────────────────────
# Add a new language by adding its code here + a _data/<code>/ folder.
# Default language (uz) is served at the root; en/ru get a /<code>/ prefix.
# Untranslated pages automatically fall back to default_lang.
plugins:
  - jekyll-polyglot

languages: ["uz", "en", "ru"]
default_lang: "uz"
exclude_from_localization: ["assets", "admin", "media", "CNAME", "markaziy-osiyo-2050_uz.pdf", "favicon"]
parallel_localization: false

collections:
  directions:
    output: true
    permalink: /directions/:name/

defaults:
  - scope:
      path: ""
      type: directions
    values:
      nav_active: directions

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - .claude
  - media/README.txt
