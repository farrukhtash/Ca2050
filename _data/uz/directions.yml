      - title: Аҳоли ўсиш прогнози
        description: БМТ ИИМД демографик сценарийлари Марказий Осиё аҳолисининг 2050 йилга қадар барқарор ўсишини кутмоқда. Минтақа учун энг “паст” сценарий ҳам жаҳон, Осиё ва айниқса Европа учун “юқори” сценарийдан юқорида турибди. “Ўртача” ўсиш прогнозига кўра, Марказий Осиёнинг меҳнатга лаёқатли ёшдаги аҳолиси (15–64 ёш) 50 миллиондан 71 миллионгача ўсади, умумий тузилмадаги улуши эса бугунги 62 фоиздан 2050 йилгача 63 фоизгача ошади. Таққослаш учун 2023–2050 йилларда Осиё ва Европада меҳнатга лаёқатли аҳоли улуши мос равишда 67 фоиздан 64 фоизга ва 64 фоиздан 58 фоизга тушади.
