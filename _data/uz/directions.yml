    scenarios:
      - title: Молиявий ва бозор чекловлари
        description: |-
          Энергетика секторида молиявий кўрсаткичларнинг заифлиги қайта тикланувчи энергия манбалари (ҚТЭМ) ва бошқа технологияларни жорий этишни секинлаштирмоқда.
          Сектор ўтиш даврида: бозор ислоҳотлари давом этмоқда, лекин паст нарх сигналлари туфайли инвестиция қилиш чекланган.
        outcome: Хусусий инвесторлар тартибга солиш ва бозор ноаниқликлари, ҳамда маълумотлар етишмаслиги муаммоларига дуч келишмоқда, бу эса технологияларни жорий этиш ва билимларни узатишни секинлаштиради.
      - title: Энергия танқислиги хавфи
        description: Инфратузилмага инвестицияларнинг етарли эмаслиги, иқлим ўзгариши (мавсумий қурғоқчиликлар) ва минтақавий мувофиқлашувнинг йўқлиги Тожикистон, Қирғизистон ва Ўзбекистонда қишда газ ва электр энергияси танқислигини кучайтириши мумкин.
        outcome: Вазият фақат 2030-йиллар бошларига бориб, Тожикистон ва Қирғизистонда янги гидроэнергетика қувватлари ишга туширилганда ва Ўзбекистонда қуёш ҳамда шамол генерацияси кенг миқёсда ривожлангандагина яхшиланиши мумкин.
      - title: Ҳавонинг ифлосланиши
        description: |-
          Ҳаво сифати айниқса шаҳарларда ёмон – у ерда PM2.5 концентрацияси кўпинча ЖССТ тавсияси бўйича (5 мкг/м³) меъёридан 6–12 марта юқори бўлиши кузатилмоқда.
          Йирик шаҳарларда (Бишкек, Душанбе, Тошкент, Олмаота) PM2.5 даражалари ЖССТнинг оралиқ мақсад кўрсаткичи (35 мкг/м³)дан икки баробар кўп.
          Қишлоқ жойларда аҳоли зичлиги камлиги сабабли ифлосланиш даражаси пастроқ, аммо умумий урбанизация муаммони кучайтириб бормоқда.
        outcome: 'Электромобиллар ва иссиқлик насослари оммавий тус олади: 2050 йилгача 20 миллионгача электромобиллар бўлади ва иссиқлик насосларидан фойдаланувчи хонадонлар улуши 50 фоиздан ошади.'
    recommendations:
      - text: |-
          Харажатларни қисқартириш ва иқтисодий манфаатларни ошириш:
          Давлатлар электр энергияси ишлаб чиқариш харажатларини қисқартириши, қиммат бўлмаган электр энергиясини юқори талаб мавсумларида импорт қилиши ҳамда ортиқча ишлаб чиқарилган энергияни талаб пастроқ пайтларида экспорт қилиши мумкин ва шу орқали вақт ва мавсумий талабдаги фарқдан самарали фойдаланилади.
          2020–2030 йилларда минтақавий электр ва газ савдоси 6,4 миллиард АҚШ долларигача иқтисодий манфаат олиб келиши кутилмоқда.
      - text: |-
          Энергетика хавфсизлигини ошириш:
          Ўзаро боғлиқ тармоқлар таъминот манбалари диверсификация қилинишини ва бир тур ёқилғи ёки ички ишлаб чиқаришга қарамликнинг камайишини, шу орқали минтақавий энергетика тизимларининг барқарорлигини таъминлайди.
      - text: |-
          Барқарор энергетика манбаларини интеграция қилиш:
          Минтақавий савдо ўзгарувчан барқарор манбалар, жумладан, Ўзбекистондаги қуёш ва Қозоғистондаги шамол энергетикасини интеграция қилишни енгиллаштиради, чегараларда ишлаб чиқариш ҳамда талабни мувозанатлаштиради.
      - text: |-
          Ифлосланиш ва иссиқхона гази чиқиндиларини камайтириш:
          Кенг миқёсда ифлослантирувчи ёқилғилар ўрнига тоза гидро- ва барқарор манбалар ёки газни импорт қилиш ҳаво ифлосланиши ҳамда иссиқхона газлари чиқиндисини камайтиради.
      - text: |-
          Инфратузилмани самарали фойдаланишни оптималлаштириш:
          Трансчегаравий савдо мавжуд ва янгиланадиган энергетика активларидан максимал фойдаланиш имконини беради, ортиқча ички инвестицияларга бўлган эҳтиёжни камайтиради.
      - text: |-
          Марказий Осиё давлатлари Энергетика кенгашини ташкил этиш орқали ҳамкорликни институционаллаштириш.
          Минтақавий энергетика хавфсизлигини таъминлаш мақсадида энергетика вазирларининг маслаҳат учрашувлари механизмини доимий фаолият юритувчи Энергетика кенгашига айлантириш лозим.
          Бу маслаҳатлашувлардан амалий ва тизимли ҳамкорликка ўтиш, минтақавий энергетика ресурсларини бошқаришда ягона ёндашувни шакллантириш ҳамда узоқ муддатли ва мажбурий қарорларни қабул қилиш учун институционал асос яратади.
      - text: Энергетика сиёсати, молиялаштириш ва рағбатлантириш механизмларини ўз ичига олган узоқ муддатли миллий стратегияларни ишлаб чиқиш ва жорий этиш.
      - text: Рақобатбардош электр энергияси бозорларини шакллантириш ва ривожлантириш.
