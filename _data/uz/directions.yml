        note: ''
    scenarios:
      - title: Иқлим ўзгаришининг таъсири
        description: Дарёларнинг юқори оқимида жойлашган мамлакатларнинг бир томонлама ривожланиши ва минтақавий ҳамкорликнинг етишмаслиги Марказий Осиё учун катта хавфлар туғдиради. Биринчи хавф – Афғонистонда амалга оширилаётган бир томонлама лойиҳалар. Масалан, Қўштепа канали қурилиши тугаллангач, Амударёдан йилига 10–16 млрд м³ сув олиб кетилиши кутилмоқда, бу эса Ўзбекистон ва Туркманистонда қишлоқ хўжалигини сув билан таъминлашга ҳамда айни чегарада жойлашган Тўямўйин гидроузелида (ТГУ) гидроэлектроэнергия ишлаб чиқаришга жиддий таъсир қилади. Бунда ТГУга сув кириши. 25 фоизга камайиши, қишлоқ хўжалигига сув етказиш тахминан 6 фоизга қисқариши ва гидроэнергия ишлаб чиқариш йилига тахминан 22 фоизга пасайиши кутилмоқда. Бу сувни дарёнинг юқори қисмида олиб қўйиш энергетика секторига қандай боғланиб қолганлигини кўрсатади.
        outcome: Хавфлар тўплами – минтақада ҳамкорлик етишмаслиги билан боғлиқ. Бу давлатлар ўртасида ишонч камлиги, минтақавий институтлар салоҳиятининг етарли эмаслиги ва сув ресурсларидан биргаликда фойдаланиш борасидаги ҳаракатларни самарали мувофиқлаштириш имкониятининг йўқлиги билан боғлиқ.
      - title: Энергетика, иқтисодиёт, демография ва геосиёсатда глобал ва минтақавий мавҳумлик
        description: |-
          Сув ресурсларини барқарор бошқариш турли ташқи омиллар таъсирида мураккаблашиб бормоқда. Энергоресурслар нархининг ўзгариши ва геосиёсий ўзгаришлар насос станцияларида сувни етказиб бериш харажатларини кескин ошириши мумкин, бу эса сув таъминоти иқтисодиётига ва давлат бюджети ҳамда якуний истеъмолчиларга юкламани оширади.
          Қишлоқ хўжалигидаги йўқотишлар мамлакатларни озиқ-овқат билан ўзини ўзи таъминлаш стратегиясига ўтишга ундаши мумкин, бу эса сувга бўлган талабни оширади ва гидроэнергетика ҳамда суғориш ўртасида рақобат кучаяди.
          Демографик омиллар ҳам ноаниқликни оширади: аҳоли сони ўсиши, миграция (шу жумладан қўшни мамлакатлардан), туғилиш даражаси, фаровонлик ва таълим сув истеъмолига тўғридан-тўғри таъсир кўрсатади.
        outcome: Оммавий миграция сув ва электр энергиясига талабнинг кутилмаган равишда ошишига сабаб бўлиб, ресурсларни режалаштириш ва бошқаришда қўшимча муаммолар юзага келтириши мумкин.
    recommendations:
      - text: |-
          Аниқланган муаммоларни ҳал этиш ва минтақанинг барқарор ривожланиши учун шароит яратиш мақсадида давлатлар тўртта асосий йўналишга эътибор қаратган:
          сувдан фойдаланиш самарадорлигини ошириш;
          янги молиявий воситаларни жорий этиш;
          сув секторида рақамлаштириш;
          мавжуд сув инфратузилмасини модернизация қилиш ва тиклаш.
      - text: |-
          Давлатлар сув инфратузилмасидан фойдаланиш қоидаларини ўзгартириб, иқлим ўзгариши ҳамда музлик захираларининг камайиши шароитида муроса йўлларини топиш ва самарали бошқарувни таъминлашга мослаштириши мумкин. Мавжуд ёндашувлар қуйидагиларни ўз ичига олади:
          Дарёларнинг юқори ва қуйи оқимида жойлашган мамлакатларининг сув омборларига қўшма инвестициялар, қўшма инфратузилмани яратиш ва мувофиқлаштирилган фойдаланиш қоидаларини ишлаб чиқиш.
          Ёз ва қиш мавсумида қор ҳамда музлик захиралари йўқотилишини қисман қоплаш мақсадида ер ости сувларини муҳофаза қилиш ва бошқариш.
      - text: Марказий Осиё мамлакатларининг янада ривожланиши мавжуд сув ва энергетик ресурслардан иқлим ўзгариши, аҳоли сонининг ўсиши ва эҳтиёжларнинг ортиши шароитида энг юқори самарадорлик билан фойдаланишга боғлиқ. Совет даврида (1960 – 1980-йиллар) ягона сув-энергетика тизими ва ўзаро боғлиқ инфратузилмалар яратилган бўлиб, бу минтақа давлатлари ўртасида ҳамкорлик ва мувофиқлаштирилган мажбуриятлар учун асосни ташкил этган эди. Совет Иттифоқи тарқалганидан сўнг давлатлар янги сув-энергетика муносабатларини шакллантирдилар, уларда давлат суверенитети ва бозор тамойиллари инобатга олинди.
      - text: Марказий Осиёда кўплаб сув объектлари – сув омборлари, гидроэлектростанциялар, каналлар ва сув олиш иншоотлари икки давлат чегарасида жойлашган ва биргаликда фойдаланилади ёки хизмат кўрсатилади. Уларни самарали бошқариш учун мамлакатлар биргаликда фойдаланиш, таъмирлаш ва молиялаштиришни таъминловчи икки томонлама шартномалар тузадилар. Муваффақиятли ҳамкорликнинг асосий жиҳатлари – яхшиланган мониторинг, сув ҳисобини юритиш ва шаффоф маълумот алмашинувидир. Рақамли технологиялар ва масофавий зондлаш анъанавий ўлчовларни тўлдириб, маълумотларнинг тўлиқлиги ва ишончлилигини ошириши мумкин.
      - text: Сув ресурсларини самарали бошқариш суғориш меъёрларини қайта кўриб чиқишни, сувни қишлоқ хўжалиги экинлари орасида оптимал тақсимлашни ва экиш схемаларини маҳаллий гидроиқлимий шароитлар ва бозор имкониятларини ҳисобга олган ҳолда қайта тузишни талаб қилади. Бу нафақат сув танқислигини камайтиришга, балки сувни тежашни рағбатлантириш ва қишлоқ хўжалиги самарадорлигини оширишга хизмат қилади. Суғориш самарадорлигини оширишга йўналтирилган қўшимча инвестициялар озиқ-овқат хавфсизлиги ва барқарор иқтисодий ўсишни таъминлаш учун муҳим аҳамиятга эга.
      - text: Сув объектларига инвестицияларни ошириш ва хизмат кўрсатиш сифатини яхшилаш мақсадида мамлакатлар хусусий сектор иштирокини таъминлаш механизмларини изламоқда. Аллақачон амалда қўлланган ёндашувлар қаторига насос станцияларини модернизациялаш ва эксплуатация қилиш учун инвесторларга топшириш, шунингдек, қишлоқ хўжалигининг сув фойдаланувчи кластерлари даражасида хўжалик ичидаги ирригация тизимларини бошқариш киради.
      - text: Сувга бўлган талабни камайтириш ва минтақада сув танқислигини пасайтириш учун суғориш инфратузилмасини модернизация қилиш ҳамда томчилатиб ва ёмғирлатиб суғориш каби илғор технологияларни жорий этишга инвестиция киритиш зарур. Бу каби чоралар сув ҳисобини юритиш ва сувдан фойдаланишга чегаралар жорий этиш билан биргаликда, сувдан оқилона фойдаланишни оширишга ва йўқотишларни қисқартиришга имкон беради.
      - text: |-
          Мавжуд сув омборлари инфратузилмаси мослашувчан бошқарув стратегиялари ва маълумотларга асосланган ёндашувлар орқали самарадорликни ошириш учун катта салоҳиятга эга. Масалан, тадқиқотларнинг кўрсатишича, Нурек сув омборида мавсумий гидрометеорологик прогнозларни операцион қарор қабул қилишга жалб этиш йиллик
          гидроэлектроэнергия ишлаб чиқаришни 13-14 фоизга ошириши мумкин, қолаверса, бу сув тошқини ва тошқинлар хавфини қисқартиришга ҳам ёрдам беради. Бу мисол маълумотларга асосланган шаффоф ёндашувлардан фойдаланиш бир вақтнинг ўзида энергия таъминотини оптималлаштириш, сув хавфларини бошқариш ва сувни рақобатчи тармоқлар орасида одилона тақсимлаш каби бир неча мақсадларга эришишга имкон беришини намоён этмоқда.
