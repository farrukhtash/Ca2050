# Йўналишлар контенти — рўйхат (list). Ҳар бир элемент `slug` орқали
# _directions/*.md файли билан боғланади (climate.md ↔ slug: climate, ва ҳ.к.).
# Sveltia CMS'да list widget сифатида таҳрирланади — MUHIM: object widget
# ишлатилмайди, чунки file-коллекцияда юқори даражадаги object widget'лар
# тил (i18n) ўтишларини кўрсатмайди (текширилди). List — leaders/press/
# essays/authors'да ишлатилган ва тасдиқланган паттерн.
#
# Майдонлар: title — саҳифа ва меню сарлавҳаси; subtitle — heroдаги қисқа
