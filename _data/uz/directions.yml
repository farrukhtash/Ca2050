        outcome: ''
      - title: Гендер тенглик ҳамда хотин-қизларнинг ҳуқуқ ва имкониятларини кенгайтириш
        description: |-
          Марказий Осиёда хотин-қизларни иқтисодиётга тўлиқ интеграция қилмасдан демографик дивидендларни тўлиқ амалга ошириб бўлмайди. Аёллар ва эркакларнинг иқтисодий фаоллик даражаси ўртасида 22 фоизлик фарқ (2024 й.) салмоқли макроиқтисодий йўқотишларни кўрсатади.

          Асосий тўсиқлар сифатида юқори туғилиш кўрсаткичи, оилани режалаштириш имкониятларининг чекланганлиги, болаларни парваришлаш хизматларининг етишмаслиги, меҳнат бозоридаги мослашувчан бўлмаган шароитлар, қарияларни парваришлаш вазифалари ҳамда аёллар таълими ва карьерасига тўсқинлик қилувчи омилларни
          кўрсатиб ўтиш мумкин. Булар аёлларнинг малакасини пасайтиради ва уларни норасмий бандликка жалб қилади.

          Минтақанинг бир қатор мамлакатларида ислоҳотлар амалга оширилди, хусусан оғир саноатда аёллар учун меҳнат тақиқининг бекор қилиниши, аёллар бошқарадиган корхоналарга субсидиялар ажратиш каби чоралар кўрилди. Бироқ асосий тўсиқ – ҳақ тўланмайдиган уй меҳнати ҳамон сақланиб қолмоқда ва бу ҳолатни ҳуқуқий воситаларнинг ўзи билан бартараф этиб бўлмайди.
        outcome: Аёллар инсон капиталига йўналтирилган мақсадли инвестициялар – ижтимоий инфратузилма ва гендер жиҳатлар ҳисобга олинган бандликнинг ривожланиши – “гендер дивиденди”дан тўлиқ фойдаланишнинг калити ҳисобланади.
      - title: Фаол ва узоқ умр кўриш
        description: |-
          Аёллар эркакларга нисбатан кўпроқ умр кўрадилар, аммо норасмий секторда бандлик ва меҳнат фаолиятидаги узилишлар сабабли уларнинг пенсия жамғармалари кам бўлади, бу эса “камбағалликнинг феминизацияси”га олиб келади. Бунинг ечими сифатида гендер жиҳатлар
          ҳисобга олинган пенсия ислоҳотлари, ижтимоий ҳимояни кенгайтириш, аёллар бандлигини расмийлаштириш ва ҳақ тўланмайдиган меҳнатни эътироф этиш кабиларни кўрсатиб ўтиш мумкин.
        outcome: Демографик прогнозлардан фойдаланиб соғлиқни сақлаш ва ижтимоий ҳимоя тизимларини режалаштириш муҳим аҳамиятга эга, чунки бу хизматларни ўз вақтида геронтологик йўналишга ўзгартиришни ва кекса аҳолининг ўзини банд этиши ҳамда жамоат ҳаётида фаол иштирокини таъминлаш имкониятини беради.
      - title: Миграция ва ҳаракатчанлик
        description: |-
          Миграция Марказий Осиё ривожланишида муҳим ўрин тутади. Тарихан бу минтақа катта миқёсдаги – қишлоқдан шаҳарга кўчиб ўтишлар ва Совет давридаги кўчиришлардан то сўнгги ташқи ва даврий меҳнат миграциясигача бўлган миграция оқимларини бошдан кечирган.
          Қирғизистон ва Тожикистон учун меҳнат миграцияси ҳаётий аҳамиятга эга бўлиб қолмоқда бу давлатлар ЯИМда пул ўтказмалари улуши бўйича дунё етакчилари қаторига киради, уларнинг катта қисми ҳозирги ва собиқ мигрантлар ҳиссасига тўғри келади.

          Ўзбекистонда ҳам шунга ўхшаш, бироқ бироз камроқ миқёсли тенденция кузатилмоқда. Қозоғистон эса, аксинча, қўшни давлатлардан келган мигрантлар учун марказга айланмоқда. Бироқ норасмий ва мунтазам бўлмаган бандлик даражасининг юқорилиги мигрантларни
          энг заиф ижтимоий гуруҳлардан бирига айлантиради, уларнинг фарзандлари эса, кўп ҳолларда ижтимоий етимга айланиб, етарли ғамхўрлик йўқлиги ва маргинализация хавфига дуч келмоқда.
        outcome: ''
    recommendations:
      - text: |-
          Хотин-қизлар учун инсон капиталини кучайтиришга инвестицияларни ошириш.

          Соғлиқни сақлаш, таълим ва кўникмаларни ривожлантириш соҳаларига давлат ва минтақавий миқёсда молиялаштиришни ошириш. Бунда хотин-қизлар ва имконияти чекланган ёшлар, айниқса қишлоқ ҳудудларида яшовчилар учун тенг имкониятларни таъминлашга устувор аҳамият бериш лозим. Қизлар, ногиронлиги бўлган болалар ва таълим
          ёки иш билан банд бўлмаган ёш аёлларни қўллаб-қувватлаш чора-тадбирларини киритиш ҳам муҳим аҳамиятга эга. Бюджетларни тузишда ва ислоҳотларни амалга оширишда гендер жиҳатларни ҳисобга олиш инвестиция самарадорлигини ошириш ва тенгсизликларни қисқартириш имконини беради.

          Оилага мос ва репродуктив сиёсатларни меҳнат бозорини ривожлантириш стратегияларига интеграция қилиш. Репродуктив саломатлик хизматидан кенг ва осон фойдаланиш имкониятини яратиш, болага қараш бўйича ҳақ тўланадиган таътил, иш вақтини мослашувчан қилиш, оммабоп нархдаги мактабгача таълим орқали оилаларни қўллаб-қувватлаш чораларини жорий этиш. Ушбу ташаббуслар бир вақтнинг ўзида аёллар бандлигини, туғилиш даражасининг барқарорлигини, меҳнат унумдорлигини ва аҳоли фаровонлигини мустаҳкамлайди.
      - text: |-
          Иқтисодий интеграция ва ёшлар имкониятларини кенгайтириш.

          Демографик тенденцияларни ҳисобга олган ҳолда, ёшларни иш билан таъминлаш стратегияларини ишлаб чиқиш. Рақамли, “яшил” ва ижтимоий кўникмаларни ривожлантирувчи дастурлар, шунингдек, ёшларни меҳнат бозори, микромолиялаштириш, “устоз-шогирд” мактаби ва стартаплардан фойдаланиш имкониятини кенгайтириш чора-тадбирлари, жумладан трансчегаравий инновацион кластерлар муҳим аҳамиятга эга.
          Минтақавий стипендиялар ва академик мобиллик дастурларини таъсис этиш. Давлатлараро фондлар ва алмашинув дастурлари ёшларга, жумладан, қишлоқ ва эҳтиёжманд жамоалар вакилларига минтақанинг етакчи олий ўқув юртларида таълим олиш имконини беради,
          айни пайтда минтақавий ўзига хосликни мустаҳкамлайди ва келажак етакчилари тармоғини яратади.

          Ёшлар сиёсати ва хавфсизлиги соҳасида трансчегаравий ҳамкорликни кучайтириш. Экстремизмнинг олдини олиш, фуқаролик иштироки, медиа саводхонлик ва танқидий фикрлашни ривожлантириш дастурларини, айниқса, миллий таркиби аралаш бўлган ва чегара бўйи ҳудудларда ривожлантириш зарур. Бу ёшларнинг барқарорлигини ҳамда
          хавфсиз ва инклюзив минтақани барпо этишдаги ролини мустаҳкамлайди.
      - text: |-
          Меҳнат бозорида кенгайтириш ва ўринлари яратиш иштирокни муносиб иш ўринлари яратиш.

          Малака ва кўникмаларни тан олишнинг минтақавий механизмларини ва ягона ўқув стандартларини жорий этиш. Бу трансчегаравий иш билан таъминлашни енгиллаштиради ва норасмий миграция кўламларини камайтиради.
          “Яшил” иқтисодиёт ва парваришлаш соҳасида иш ўринларини яратиш. Қайта тикланувчи энергетика, барқарор қишлоқ хўжалиги, чиқиндиларни қайта ишлаш ҳамда кексалар ва болаларни парваришлаш соҳаларига қилинадиган инвестициялар ишсизликни камайтиради ва барқарор ривожланиш мақсадларини қўллаб-қувватлайди.

          Аёлларнинг иқтисодий фаоллиги учун тўсиқларни бартараф этиш. Бизнесни рўйхатдан ўтказишни енгиллаштирадиган, аёллар бандлигини кенгайтирувчи ва болалар ҳамда кексаларга оид парвариш хизматларидан фойдаланиш имкониятини таъминловчи иш берувчиларни рағбатлантирувчи ислоҳотлар талаб этилади.
      - text: |-
          Аҳолининг қаришига тайёргарлик.

          Пенсия ва узоқ муддатли парвариш тизимларини модернизация қилиш. Бу молиявий барқарорлик, барча учун, айниқса, аёллар ҳамда норасмий сектор ишчилари учун адолат ва хизматдан тўсиқсиз фойдаланишни таъминлаш учун зарурдир.

          Фаол узоқ умр кўришни тарғиб қилиш. Қайта тайёрлаш, устоз-шогирдлик, рақамли таълим ва волонтёрлик тажрибасини ўзаро алмашиш кексаларга иқтисодиёт ва жамият тараққиётига ўз ҳиссасини қўшиш имконини яратади.

          Қариш масалалари бўйича минтақавий мулоқотни кенгайтириш. Биргаликда демографик прогноз қилиш, статистика алмашуви ва эксперт маслаҳатлари ижтимоий ва иқтисодий тизимларни янги шароитларга мослаштиришга ёрдам беради.
      - text: |-
          Хавфсиз ва самарали миграция.

          Миграция сиёсати ва мигрантлар ҳуқуқларини ҳимоя қилишни мувофиқлаштириш. Малакаларни ўзаро тан олиш, стандартлаштирилган меҳнат шартномалари ва ҳуқуқий ҳимоя механизмларини жорий этиш, айниқса, аёллар ва ёшлар учун, муҳим аҳамиятга эга.
          Ижтимоий нафақалар ва хизматлар учун экстратерриториаллик принципини илгари суриш. Икки томонлама ва минтақавий битимлар мигрантлар ва уларнинг оилалари учун йиғилиб бориладиган пенсия маблағларининг сақланиши, соғлиқни сақлаш ва таълим хизматларидан фойдаланиш имкониятини кафолатлаши керак.

          Рақамли ID ва замонавий инфратузилма орқали ҳаракатланиш имкониятларини осонлаштириш. Бундай воситалар ёшлар, талабалар ва мутахассислар учун шаффофликни оширади ҳамда ҳаракатланиш имкониятини соддалаштиради.
      - text: |-
          Демография ва иқлим барқарорлиги.

          Демографик омилларни иқлим стратегияларига интеграция қилиш.

          Бу, энг аввало, шаҳарсозлик, сув таъминоти ва озиқ-овқат хавфсизлигига тааллуқлидир.
          Табиий ресурсларни бошқаришда минтақавий ҳамкорликни кучайтириш. Орол ҳавзасида, айниқса, сув, ер ва экотизимлар бўйича ҳамкорлик жуда муҳим.

          Гендер ва ёш хусусиятларини ҳисобга олган ҳолда эрта огоҳлантириш тизимларини ривожлантириш. Аёллар ва ёшлар демографик
          мослашув марказида бўлиши керак.
      - text: |-
          Режалаштиришда демографик таҳлилни қўллаш. 

          Аҳолини мунтазам рўйхатга олиш ва прогнозлашни ривожлантириш. Бу муҳим ўзгаришларни ўз вақтида инобатга олиш ва стратегияларни мослаштириш имконини беради.

          Статистик кўрсаткичларни уйғунлаштириш. Ўзаро уйғун методологиялар трансчегаравий таҳлил ва ҳамкорликдаги режалаштиришни енгиллаштиради.

          Минтақавий демографик марказлар ташкил этиш. Улар маълумотларни таҳлил қилиш, тадқиқотлар ўтказиш ва барқарор ривожланиш учун илмий асосланган тавсиялар тайёрлашни мувофиқлаштиради.
