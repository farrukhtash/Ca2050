directions:
  - slug: climate
    title: Иқлим ўзгариши
    subtitle: Иқлим ўзгариши динамикасини тушуниш Марказий Осиёда стратегик режалаштириш учун асосий омилдир.
    stats:
      - value: 1,2 °C
        label: Ўртача йиллик ҳарорат XX асрнинг ўрталаридан бери тахминан кўтарилган.
      - value: 20%
        label: Қор қоплами қалинлиги тахминан камайди.
      - value: 20%
        label: Минтақа аҳолисининг қарийб (ҳар 100 йилда бир марта бўладиган) сув тошқини хавфи юқори бўлган ҳудудларда яшайди.
      - value: 2021 / 2024
        label: йилларда минтақа энг кучли қурғоқчиликни бошдан кечирди.
      - value: 2х
        label: Марказий Осиёда ҳарорат дунёдаги ўртача кўрсаткичдан деярли тезроқ кўтарилмоқда, унда кўпроқ буғланиш, музликларнинг эриши, тартибсиз ёғингарчилик кузатилмоқда.
    intro: |-
      Иқлим “таҳдидлар кўпайтирувчиси”га айланмоқда, у сув танқислигини кучайтириб, озиқ-овқат хавфсизлигига путур етказмоқда ва мураккаб ҳамда баъзан олдиндан айтиб бўлмайдиган ўзаро боғлиқликлар орқали минтақавий кескинликни оширмоқда.

      Хавф-хатарларнинг бундай ўзаро чирмашиб кетиши юқори даражадаги ноаниқликка олиб келади. Бу эса, стратегия бир вақтнинг ўзида ҳам ишончли – келажакнинг турли сценарийларига бардошли, ҳам мослашувчан ўзгаришлардан сўнг мослашиш ва тикланиш қобилияти а эга бўлиши кераклигини англатади. Бунинг учун минтақадаги иқлим тенденцияларини аниқ тушуниш, прогнозларни билиш ва уларнинг чекловларини ҳисобга олиш зарур.

      Ҳарорат сезиларли даражада ошмоқда ва бу тенденция яна давом этади.

      Батафсил китобда.
    charts:
      - image: /assets/images/uploads/4. Климат.png
        caption: Кабағалликда яшовчи ва сув тошқини хавфи юқори бўлган аҳоли. Манба:Жаҳон банки (2024 йил).
        note: ''
      - image: /assets/images/uploads/6. Климат.png
        caption: 'Марказий Осиё музликлари массаси балансининг ўлчанган ва қайта тикланган вақтли қаторлари. Манба: Barandun et. al (2020).'
        note: ''
      - image: /assets/images/uploads/7. Климат.png
        caption: 'Асосий тоғ тизмалари ва музликлар харитаси. Манба: Barandun et. al (2020).'
        note: ''
      - image: /assets/images/uploads/5. Климат.png
        caption: 'Марказий Осиёнинг барча беш давлатидаги тармоқлар бўйича умумий чиқиндилар, Net Zero ва Reference сценарийларида бирлаштирилган.Изоҳ: чапдаги график асосий сценарийни, ўнгдаги график эса паст углеродли ривожланиш сценарийини акс эттиради.'
        note: ''
      - image: /assets/images/uploads/3. Климат.png
        caption: '2065-2085 йилларда кутилаётган бир кунлик энг кўп ёғингарчилик ҳажми. Бу оралиқлар ҳар бир умумий ижтимоий-иқтисодий ривожланиш йўллари (Shared Socioeconomic Pathways, SSP) учун прогнозларнинг 10- (паст) 90- (юқори) фоизларини кўрсатади. Тарихда кузатилган оралиқлар – 1995 йилдан 2014 йилгача. Маълумот манбаси: ИОБП, 2025 йил.'
        note: ''
    scenarios:
      - title: 'Минтақавий хавфлар:'
        description: |-
          Марказий Осиёда ҳарорат дунёдаги ўртача кўрсаткичдан деярли икки баравар тезроқ кўтарилмоқда, унда кўпроқ буғланиш,музликларнинг эриши, тартибсиз ёғингарчилик кузатилмоқда.

          Экстремал ҳодисалар (қурғоқчилик, сув тошқинлари, кўчкилар) тезтез содир бўлиб, инфратузилма ва ижтимоий ҳимояга муҳтож қатламга таҳдид солмоқда.

          Сув билан боғлиқ фавқулодда вазиятлардан келадиган иқтисодий зарар йилига ялпи ички маҳсулотнинг 1,3 фоизига етиши, ҳосилдорлик эса 2050 йилга келиб 30 фоизга камайиши мумкин.
        outcome: 'Хулоса: вазиятга мослашмаса, минтақа сурункали сув беқарорлиги ва жиддий иқтисодий йўқотишларга дуч келади.'
      - title: Марказий Осиёда қишлоқ хўжалиги айниқса иқлим ўзгаришларига таъсирчанроқ ҳисобланади.
        description: |-
          Ўзбекистон ерларнинг деградацияси ва тупроқнинг шўрланиши муаммосига дуч келмоқда, бу эса ёғингарчилик режимининг ўзгариши билан бирга ҳосилдорликнинг пасайишига сабаб бўлади ва озиқовқат хавфсизлигига таҳдид солади.

          Тожикистон суғориш ва қишлоқ хўжалиги экинлари ҳосилдорлигига таъсир кўрсатадиган сув ресурсларидан фойдаланишнинг юқори ўзгарувчанлиги оқибатларини бошдан кечирмоқда.

          Қозоғистон шимолий ҳудудларда иқлим минтақаларининг ўзгариши юз бермоқда, бу эса дон етиштириш ва яйловлар сифатига таъсир кўрсатмоқда.

          Қирғизистон эса, қишлоқ хўжалиги экинлари учун ҳарорат стресси муаммосини ҳал қилишга мажбур, бу эса ишлаб чиқаришнинг режалаштирилган ўсиши фонида суғоришга бўлган эҳтиёжни оширади.
        outcome: Ҳароратнинг кўтарилиши ва ёғингарчиликнинг ўзгарувчанлиги, умуман олганда, бутун минтақа бўйлаб қишлоқ хўжалиги ишлаб чиқаришининг одатий шароитларини бузса-да, улар бир вақтнинг ўзида эрта мослашиш ва инновацияларни жорий этиш учун стратегик имкониятлар эшикларини очмоқда.
      - title: 'Иқлим ўзгариши электр энергиясига ҳам таъсир қилади, айниқса гидроэнергетикага боғлиқлик юқори бўлган жойларда буни яққол кўриш мумкин:'
        description: |-
          Тожикистон ва Қирғизистонда музликларнинг қисқариши ва ёғингарчилик режимининг ўзгариши дарё оқими ҳажмининг прогнозини қийинлаштирмоқда, бу эса гидроэнергетика барқарорлигига путур етказади.

          Ўзбекистонда энергетика тизими ҳаддан ташқари иссиқ даврда талабнинг ошиши ва иссиқлик электр станцияларини совутиш учун зарур бўлган сувдан фойдаланишнинг чекланишидек икки томонлама босимни бошдан кечирмоқда.

          Қозоғистонда энергетика ҳам совутишга бўлган эҳтиёжнинг ортиши, ҳам чиқиндиларни камайтириш учун қайта тикланувчи энергия манбаларига ўтиш зарурати билан тўқнашмоқда.
        outcome: Иқлим ўзгариши тармоқлар ўртасида сув учун рақобатни кучайтирмоқда, бу эса олдиндан пухта режалаштиришни талаб қилади.
    recommendations:
      - text: |-
          Келажакдаги иқлимнинг турли сценарийларида фойда келтирадиган, барқарорликни оширадиган, заифликни камайтирадиган ва тегишли қўшимча фойда келтирадиган (сувдан яхшироқ фойдаланиш, фавқулодда вазиятларга тайёрлик, аҳоли саломатлигини яхшилаш)
          “win-win” (ҳар икки ҳолатда ҳам муваффақиятга эришиш) стратегияларига устуворлик берилади.
      - text: Кескин об-ҳаво ҳодисаларини ҳисобга олган ҳолда транспорт, сув таъминоти ва энергетикага инвестиция қилиш, янги лойиҳаларни ёғингарчилик интенсивлигининг ўсишига мўлжаллаш ва табиий офатлар хавфини бошқариш тизимлари билан боғлаш лозим. Шунингдек, энг муҳим инфратузилмаларни ҳимоя қилиш бўйича амалий устувор вазифа сифатида сув аъминоти, энергетика ва транспорт тизимларини келажак иқлим шароитларини инобатга олган ҳолда модернизация қилиш назарда тутилади.
      - text: |-
          Эрта огоҳлантириш тизимларини йўлга қўйиш, сув тошқинлари, кўчкилар ва қор кўчкиларига тайёргарлик тизимларини ривожлантириш, иқлим хавфларини асосий тармоқларни ривожлантиришнинг узоқ муддатли режаларига киритиш зарур. Амалий устувор йўналиш сифатида комплекс хавфлар ва заифликларни баҳолаш белгиланади:
          қишлоқ хўжалиги;
          энергетика;
          сув ресурслари;
          соғлиқни сақлаш
          соҳалари бўйича хавф хариталари ҳамда соҳалар орасида амалий ҳаракат режаларини ишлаб чиқиш.
      - text: |-
          Иқлимга мослашувчан усулларни жорий этиш (экинларни диверсификация қилиш, самарали суғориш, тупроқни сақлаш, алмашлаб экиш ва ўғитлаш, ўрмонзорлар барпо қилиш) зарур.
          Бу йўналишнинг амалий устувор қисми сифатида узоқ муддатли кўкаламзорлаштириш ва чўлланишга қарши кураш дастурларини ишлаб чиқиш кўзда тутилади: ерларни тиклаш, тупроқнинг деградациясига барҳам бериш ва иқлим ҳамда демографик ўзгаришларга мослашиш бўйича ягона минтақавий стратегияни шакллантириш.
      - text: 'Қишлоқ хўжалиги стратегияларини сув ресурсларининг реал мавжудлиги билан мувофиқлаштириш лозим: режалаштирилган саъй-ҳаракатларни сув билан таъминлаш ёки қишлоқ хўжалиги амалиётларини сув танқислигига мослаштириш талаб этилади. Амалий устувор йўналиш сифатида мувофиқлаштирилган аграр ва сув сиёсати белгиланади: барқарор қишлоқ хўжалиги амалиётларига ўтиш, сувга кам эҳтиёжли экинлар экишни кенгайтириш ҳамда суғоришга боғлиқликни камайтириш.'
