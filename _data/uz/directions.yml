      - value: 40% +
        label: Минтақанинг суғориш тизимлари ўта эскирганлиги, сурункали маблағ етишмаслиги ва каналларда сув йўқотилиши билан тавсифланади.
      - value: 2030 - 7% + / 2050 - 10% +
        label: Мавжуд инфратузилмани қайта қуриш ва модернизация қилиш 2030 йилга келиб сувни 7 фоизга, 2050 йилга келиб эса 10 фоизгача тежашни таъминлаши мумкин.
      - value: 2030 - 20% / 2050 - 50%
        label: Замонавий суғориш усулларини жорий этиш ҳосилдорликни 2030 йилга келиб 20 фоизга, 2050 йилга келиб эса 50 фоизга ошириши мумкин
      - value: 123 млрд м3
        label: Минтақада ер ости сувларининг эҳтимолий захираларининг умумий ҳажми йилига баҳоланмоқда, бунда атиги 23 фоизидан фойдаланилади.
      - value: 10 млн
        label: Минтақада киши хавфсиз ичимлик сувидан маҳрум.
      - value: 11 - 19 %
        label: 2020 йилда музликлар ҳажми 533 км³ деб баҳоланган, 2050 йилгача уларнинг қисқариши кутилмоқда.
    intro: |-
      Миллий ислоҳотларга қарамасдан, минтақа ҳануз сув салоҳиятидан самарали фойдаланиш учун мулоқот ва мувофиқлаштиришни чуқурлаштиришга катта эҳтиёж сезмоқда.

      Ҳудуд муаммолари оддий сув танқислигидан анча кенг бўлиб, улар иқтисодиёт барқарорлиги, соғлиқни сақлаш, ижтимоий барқарорлик ва трансчегаравий муносабатлар билан боғлиқ.

      Ҳароратнинг ортиши қишлоқ хўжалиги экинларининг сувга бўлган эҳтиёжини оширади, бу эса сув тизимларига янада ортиқча босим ва сув танқислиги хавфини келтириб чиқаради.

      Ер ости сувларини самарали бошқариш учун комплекс ва барқарор ёндашув зарур, у такомиллаштирилган мониторинг ва сувдан фойдаланишни тартибга солишни ўз ичига олади. Ҳокимият органлари ўртасида ваколатларнинг устма-уст тушиши ва такрорланиши оптимал қарор қабул қилишга халал беради.
