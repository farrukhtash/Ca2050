        label: Агар сувни бошқариш сиёсати ва амалиёти ўзгармай қолса, 2050 йилга бориб, Марказий Осиёда умумий иқлимий ва ижтимоийиқтисодий омиллар натижасида ЯИМ камайиши мумкин
