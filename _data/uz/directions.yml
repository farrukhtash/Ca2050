          2030 йилгача тахминан 500 миллиард АҚШ доллари талаб қилинади. Шу билан бирга, CAREC доирасида 22 та транспорт лойиҳаси амалга оширилган (2001-2024 йилларда 6,1 миллиард АҚШ доллари ҳажмида), Хитой “Бир белбоғ-бир йўл” ташаббуси доирасида 20 миллиард АҚШ долларидан кўпроқ сармоя киритган, ЕИ эса “Global Gateway” дастури доирасида Транскаспий йўналишини ривожлантириш учун 10 миллиард еврогача инвестиция киритиш режасини эълон қилган.
        outcome: 'Бу истиқболли коридор икки асосий темир йўл йўналишини ўз ичига олади: I йўналиш — Термиз – Мозори Шариф – Ҳирот йўналиши орқали Бандар-Аббос ва Чобаҳор портларига; II йўналиш — Термиз – Найбобод – Майдоншаҳр – Лоғар – Харлачи налиши – мазкур йўналишлар ишлаб чиқиш ва келишиш босқичида. Покистон портларига чиқувчи Трансафғонистон темир йўлининг (647 км) тахминий қиймати 4,6 миллиард АҚШ долларига баҳоланмоқда. Ушбу икки коридор бўйича кутилган юк оқими йилига қарийб 10 миллион тоннани ташкил этади, кейинги ўн йилда эса, 40 миллион тоннагача ошиши мумкин. Дастлабки баҳолашларга кўра, мазкур коридор орқали юк ташиш муддати 35 кундан 3-5 кунгача қисқаради, шунингдек, контейнер ташиш харажатлари деярли икки баробар камаяди.'
