concepts:
  - title: Ҳашар (ашар, асар)
    description: |-
      Ўзбекистон ва Марказий Осиёнинг бошқа давлатларида кенг тарқалган, ўзаро ёрдам ва ҳамжиҳатликка асосланган анъанавий кўнгилли жамоавий меҳнат шакли. Қўшнилар келишган ҳолда ариқларни тозалашади, томларни таъмирлайди ёки совуқ тушмасдан олдин ҳосилни
      биргаликда йиғиб олишади. Ушбу эссе муаллифи таъкидлайдики, айнан мана шу анъана туфайли минтақамизда ўзаро ёрдам ва умумий ресурсларни бошқариш бўйича ишлайдиган режа шундоқ ҳам мавжуд. Бу – бугун сув масаласида бўладими, эртага маълумотлар тармоғи бўладими, фарқи йўқ.
