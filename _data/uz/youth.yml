concepts:
  - title: Ҳашар
    description: Маҳалла аҳли ёки қариндош-уруғнинг умумий фойда учун ҳақ талаб қилмасдан биргаликда ишлаши — анъанавий ўзаро ёрдам ва жамоавий масъулият шакли.
