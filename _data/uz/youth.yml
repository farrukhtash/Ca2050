# калитлари остида) — шу ерда фақат матн/рўйхат контенти.
intro_text: |-
  Китобнинг алоҳида боби Марказий Осиё минтақаси ёшларига бағишланган — уларнинг 2050 йилгача бўлган келажак ҳақидаги эсселари ва мулоҳазалари ушбу боб орқали жамланган.

  Минтақа бўйлаб турли давлатлардан хоҳиш билдирган ёшлар ўз ҳудудларининг келажагини эркин шаклда — эссе, шахсий кузатув ёки таҳлил тарзида — ёзиб беришди. Уларнинг матнлари китобнинг расмий таҳлилий бўлимларини тўлдирувчи, кенг жамоатчилик нуқтаи назарини акс эттирувчи қисм сифатида киритилган.
highlights_intro: "Йиғилган эсселар қуйидаги марказий мавзулар атрофида шаклланади:"
highlights:
  - text: "Фуқаролик маданияти ва ўзлик масалалари"
  - text: "Соғлиқни сақлаш ва турмуш сифати"
  - text: "Минтақавий интеграция ва ҳамкорлик"
  - text: "Экология ва технологик ўзгаришлар"
concepts:
