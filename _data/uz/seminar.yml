about_eyebrow: "Семинар ҳақида"
about_h2: "Минтақа экспертларининг биргаликдаги мулоқоти"
about_paragraphs:
  - text: "Форсайт-семинар доирасида беш давлатнинг таҳлилий марказлари вакиллари ва мустақил экспертлари Тошкентда икки кун давомида йиғилиб, минтақанинг 2050 йилгача бўлган келажаги бўйича сценарийларни муҳокама қилишди. Тадбир «Марказий Осиё давлатлари 2050» китобининг тайёрланиш жараёнидаги асосий босқичлардан бирига айланди."
  - text: "Иштирокчилар сув ва иқлим ўзгариши, энергетика, транспорт алоқалари ҳамда демография бўйича гуруҳли сессияларда ишлаб, ҳар бир йўналиш учун асосий хулоса ва тавсияларни шакллантиришди."

