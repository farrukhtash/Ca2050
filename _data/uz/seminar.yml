hero_eyebrow: Биринчи форсайт-методологияси бўйича минтақавий тадбир
hero_title: Форсайт-семинар 2025
hero_dates: 27–28 май 2025 йил, Тошкент шаҳри
hero_organizers: |-
  Семинар ташкилотчилари: Ўзбекистон Республикаси Президенти ҳузуридаги Стратегик ривожланиш ва ислоҳотлар агентлиги, Ўзбекистон Республикаси Президенти ҳузуридаги Стратегик ва минтақалараро тадқиқотлар институти, Марказий Осиё халқаро институти.

  Европа Итифоқининг Ўзбекистондаги ваколатхонасининг молиявий кўмагида ташкил этилгагн ушбу семинар.
about_eyebrow: Семинар ҳақида
about_h2: Минтақа экспертларининг биргаликдаги мулоқоти
about_paragraphs:
  - text: Форсайт-семинар доирасида беш давлатнинг таҳлилий марказлари вакиллари ва мустақил экспертлари Тошкентда икки кун давомида йиғилиб, минтақанинг 2050 йилгача бўлган келажаги бўйича сценарийларни муҳокама қилишди. Тадбир «Марказий Осиё давлатлари 2050» китобининг тайёрланиш жараёнидаги асосий босқичлардан бирига айланди.
  - text: Иштирокчилар сув ва иқлим ўзгариши, энергетика, транспорт алоқалари ҳамда демография бўйича гуруҳли сессияларда ишлаб, ҳар бир йўналиш учун асосий хулоса ва тавсияларни шакллантиришди.
quotes_eyebrow: Иштирокчилар фикри
quotes_h2: Асосий иқтибослар
quotes:
  - photo: /assets/images/uploads/wlmiNr17484131524319_b.jpg
    name: Баходир Рахматов
    position: Ўзбекистон Республикаси Президенти ҳузуридаги Стратегик ривожланиш ва ислоҳотлар агентлиги собиқ директори
    quote: «Бу ерга шунчаки одамлар эмас, балки келажак ҳақида мавҳум фикр юритмай, уни айнан маълумотлар, стратегиялар, қарорлар ва ислоҳотлар назари билан кўришга тайёр инсонлар йиғилган.»
  - photo: /assets/images/uploads/toivo_klaar.jpg
    name: Тойво Клаар
    position: Европа Иттифоқининг Ўзбекистондаги фавқулодда ва мухтор элчиси
    quote: «Европа Иттифоқида аъзо давлатлар ўртасидаги ҳамкорликни назарда тутиб, “Биргаликда янада кучлироқмиз” деган иборани кўп қўллаймиз. Ишончимиз комилки, бу тамойил Марказий Осиё мамлакатлари учун ҳам бирдек амал қилади.»
  - photo: /assets/images/uploads/beIQON17484134392974_l.webp
    name: Акрамжон Неъматов
    position: Ўзбекистон Республикаси Президенти ҳузуридаги Стратегик ва минтақалараро тадқиқотлар институти директорининг биринчи ўринбосари
    quote: «Сўнгги йилларда минтақадаги экспертлар мулоқоти сезиларли даражада фаоллашди. Бундай учрашувлар, айниқса, жаҳон сиёсатида кучайиб бораётган ва чўзилаётган беқарорлик фонида, бир-биримиз билан яқиндан танишиш ҳамда ҳамкорликнинг муҳим масалаларини муҳокама қилиш имконини беради.»
  - photo: /assets/images/uploads/lVladI17484149174974_b.jpg
    name: Азиза Умарова
    position: Ўзбекистон Республикаси Президенти ҳузуридаги Стратегик ислоҳотлар агентлигининг “Бюрократияни бартараф этиш – 2030” ва инновациялар офиси раҳбари
    quote: «Семинар қатнашчиларининг иши назария билангина чекланиб қолмаслиги муҳим. Асосий вазифа — давлат раҳбарлари столига қўйиладиган аниқ тавсияларни тайёрлашдан иборат.»
  - photo: /assets/images/uploads/eUh6RL17484139719633_b.jpg
    name: Шерзод Файзиев
    position: Марказий Осиё халқаро институти директори ўринбосари
    quote: «Биз давлат раҳбарлари томонидан илгари сурилган 300 га яқин ташаббусни санадик. Бу минтақавий ҳамкорликни ривожлантириш ва умумий вазифаларни ҳал этишга бўлган жиддий ниятдан далолат беради.»
  - photo: /assets/images/uploads/gDLkHw17484149215956_b.jpg
    name: Аида Каражанова
    position: Форсайт соҳасида эксперт
    quote: «Форсайт – жорий тенденциялар таҳлили ҳамда экспертлар фикрига таянган ҳолда келажак сценарийларини яратиш ва юзага келиши мумкин бўлган хатарларни ҳисобга олишга ёрдам берадиган стратегик прогнозлаш усулидир.»
