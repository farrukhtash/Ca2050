leaders:
  - photo: /assets/images/uploads/kz1-3324-2_mediumThumb.jpg
    flag: /assets/images/uploads/images (1).jpg
    quote: «Геосиёсий ноаниқлик ва дунёнинг тузилиш модели емирилиши бу, аслида, ягона прагматик ёндашувдир. Бизнинг келажагимиз бирдамликни, ўзаро ишончни ва дунёга очиқликни мустаҳкамлашга боғлиқ. Фақат шу тамойиллар асосидагина биз Марказий Осиёнинг жўшқин, инновацион ва маданий жиҳатдан бой минтақа сифатидаги ренессансини таъминлай оламиз.»
    name: Қасим-Жомарт Тоқаев
    position: Қозоғистон Республикаси Президенти
    country: Қозоғистон
    order: 2
  - photo: /assets/images/uploads/DOS_5161.jpg
    flag: /assets/images/uploads/new-flag-kyrgyzstan-kyrgyz-original-260nw-2409846521.jpg
    quote: «...Марказий Осиё мамлакатлари ўзаро визасиз режимни, бошқа давлатлардан келган меҳмонлар учун эса Шенген визаси каби минтақанинг барча мамлакатлари бўйлаб эркин ҳаракатланиш имконини берувчи ягона визани жорий этиш жараёнини бошлаши лозим.»
    name: Садир Жапаров
    position: Қирғиз Республикаси Президенти
    country: Қирғизистон
    order: 3
  - photo: /assets/images/uploads/55512943786_a2546a7a88_b.jpg
    flag: /assets/images/uploads/images (3).jpg
    quote: «Дунё шиддат билан ўзгариб бораётган ҳозирги шароитда Марказий Осиёнинг келажагига нисбатан умумий нуқтаи назарни шакллантириш зарурати пайдо бўлди.»
    name: Эмомали Раҳмон
    position: Тожикистон Республикаси Президенти
    country: Тожикистон
    order: 4
  - photo: /assets/images/uploads/20-09 001.jpg
    flag: /assets/images/uploads/images (2).jpg
    quote: «Биз ўзлигимизни, мустақиллигимизни, ички ва ташқи тараққиёт моделини танлаш ҳуқуқимизни сақлаб қолган ҳолда, минтақамизни гуллаб-яшнаган, юксак даражада ривожланган ва замонавий глобал алоқаларга чуқур интеграциялашган ҳудудга айлантириш йўлида якдилмиз. Ишончим комилки, фақат шундай шароитдагина давлатларимиз ва халқларимиз ўзининг муносиб ва ишончли келажагини таъминлай олади.»
    name: Сердар Бердимуҳамедов
    position: Туркманистон Президенти
    country: Туркманистон
    order: 5
  - photo: /assets/images/uploads/14515701-a26b-2a2d-0285-bf8c09aa365a.jpg
    flag: /assets/images/uploads/images.jpg
    quote: «Ҳозирги ўта мураккаб даврда Ўзбекистон ва Марказий Осиё минтақаси халқаро ҳамжамиятга бебаҳо ресурс – барқарорлик, ишонч ва тараққиётни таклиф этмоқда.»
    name: Шавкат Мирзиёев
    position: Ўзбекистон Республикаси Президенти
    country: Ўзбекистон
    order: 1
