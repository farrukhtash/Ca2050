title: Китоб ишлаб чиқишда иштирок этган ташкилотлар
text: |-
  Европа Иттифоқи Ўзбекистон ва Қозоғистондаги делегацияларига ушбу ташаббусни изчил ва самимий қўллаб-қувватлагани учун чуқур миннатдорлик билдирамиз. Хусусан, Европа Иттифоқининг 2 та ваколатхонаси Марказий Осиёнинг бошқа давлатларидан экспертлар ташрифини молиялаштириб, мулоқот ва тажриба алмашинуви учун муҳим шароит яратди. Айниқса, Европа Иттифоқининг Ўзбекистондаги элчиси Тойво Клаар ва Европа Иттифоқининг Ўзбекистондаги делегациясида дастурлар бўйича менежери Яна Купришага шахсий эътибори, ишонч ва амалий ёрдами ушбу жараённинг муваффақиятига катта ҳисса қўшди.

  Шунингдек, Жаҳон банкининг Европа Иттифоқи, Швейцария ва Буюк Британия ҳукуматлари билан ҳамкорликда амалга оширилаётган Central Asia Water and Energy Program (CAWEP) дастурига сув ресурсларидан самарали фойдаланиш, иқлим ўзгариши ва энергетика соҳаларида тақдим этилган юқори даражадаги экспертлик кўмаги ва конструктив ҳамкорлик учун алоҳида ташаккур изҳор этамиз. Китобнинг 4, 5 ва 6- боблари айнан ушбу дастур материаллари ва таҳлилий ишланмалари асосида шакллантирилди ҳамда мазмун жиҳатидан бойитилди.

  БМТнинг Аҳолишунослик жамғармасига (UNFPA) стратегик шериклик, шунингдек, инсон тараққиёти ва ижтимоий жараёнларга бағишланган мавзуларни чуқур ҳамда ҳар томонлама ёритишдаги салмоқли ҳиссаси учун самимий миннатдорлик билдирамиз. Хусусан, китобнинг 2- ва 8-боблари, шунингдек, Марказий Осиёнинг беш республикаси демографияси бўйича тайёрланган маълумотномаилова мазкур ҳамкорлик самарасидир. Жамғарма кўмаги билан нашрда минтақанинг демографик ўзгаришлари бўйича илмий асосланган прогнозлар акс эттирилди, шу билан бирга Марказий Осиё аҳолисининг умумлаштирилган ва яхлит демографик қиёфаси шакллантирилди. Шу муносабат билан UNFPA Ваколатхонаси раҳбари доктор Нигина Аббасзодага, UNFPAнинг Ўзбекистондаги мамлакат офиси жамоасига, ҳамда UNFPA минтақавий офиси жамоасига ушбу ташаббусни амалга оширишдаги доимий қўллаб-қувватлови ва самарали ҳамкорлиги учун алоҳида миннатдорлик изҳор этамиз.

  9-боб – Минтақа фуқаролари овози ифода этилган иншолар тўплами муҳаррирлар меҳнати туфайли юксак савияда шаклланди ва шу муносабат билан таҳририят жамоасига алоҳида миннатдорлик билдирамиз. “Mampassi Collective of Central Asia” минтақавий ҳамжамияти асосчиси Дина Игликова ҳамда ҳамжамият резиденти, Марказий Осиё тадқиқотчиси доктор Сийнат Султоналиева бир ой мобайнида минтақа мамлакатларидан келиб тушган юздан ортиқ эссени синчковлик билан кўриб чиқиб, энг муносибларини саралаб олдилар. Уларнинг пухта таҳлилий шарҳлари умумий мунозаранинг ажралмас қисмига айланди ва китоб мазмунига шахсийлик ҳамда ҳиссий чуқурлик бағишлади. Уларнинг доимий қўллаб-қувватлови, тафсилотларга юксак эътибори ва минтақа фуқароларининг овозини ифода этадиган мазмунли бўлимни шакллантиришдаги беқиёс ҳиссаси учун самимий миннатдорлик изҳор этамиз.

  Шунингдек, Gazeta.uz таҳририятига материалларни эълон қилгани ва иншолар танловини кенг ёритгани учун алоҳида ташаккур айтамиз. Айнан уларнинг медиа-қўллаб-қувватлови орқали аудиторияни кенгайтириш ва иштирокчиларнинг янада кенг доирасини жалб этиш имкони яратилди.
  Ушбу китоб кўплаб инсонлар ва ташкилотларнинг қўллаб-қувватлови, ишончи ва ҳамкорликдаги саъй-ҳаракатлари туфайли дунё юзини кўрди. Ҳар бир қўшилган ҳисса, у ақлий бўладими, ташкилийми, экспертлик ёки инсонийми, у муҳим ва беқиёс эди.
