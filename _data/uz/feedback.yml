hero_eyebrow: "Алоқа"
hero_title: "Фикрингизни қолдиринг"
hero_sub: "Китобни ўқиб чиқдингизми? Сиз китоб, унинг хулосалари ва минтақа келажаги ҳақидаги фикр-мулоҳазаларингизни қолдиришингиз мумкин. Ҳар бир фикр биз учун муҳим."

intro_paragraphs:
  - text: "«Марказий Осиё давлатлари 2050» китоби минтақа келажаги ҳақидаги очиқ мулоқотнинг бошланиши, якуни эмас. Китобни ўқиганингиздан сўнг қандай фикр ва саволлар пайдо бўлгани биз учун муҳим — бу тадқиқот жараёнини ва кейинги нашрларни яхшилашга ёрдам беради."
  - text: "Қуйидаги қисқа сўровнома орқали китобнинг қайси йўналишлари сиз учун фойдали бўлгани, нималар етишмаётгани ва минтақа келажаги бўйича қандай мавзуларни чуқурроқ ёритиш кераклигини баён қилишингиз мумкин. Жавоблар бир неча дақиқа вақт олади."

form_eyebrow: "Сўровнома"
