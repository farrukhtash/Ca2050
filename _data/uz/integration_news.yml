  - image: /assets/images/uploads/photo_2026-09-11_16-29-25.jpg
    title: “Корея–Марказий Осиё” саммити ўтказилади
    description: |-
      Шавкат Мирзиёев 14 сентябрда Сеулда Жанубий Корея президенти Ли Чжэ Мён билан учрашади.

      16 сентябрда эса тарихда биринчи “Корея–Марказий Осиё” саммити ўтказилади. Унда беш давлат раҳбари иштирок этади.

      Муҳокамадаги мавзулар — муҳим минераллар, энергетика, сунъий интеллект ва бизнес ҳамкорлиги.
