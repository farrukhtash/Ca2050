directions:
  - slug: climate
    title: Climate change
    subtitle: Understanding the dynamics of climate change is a key factor for strategic planning in Central Asia.
    stats:
      - value: 1.2 °C
        label: Approximate rise in average annual temperature since the mid-20th century.
      - value: 20%
        label: Approximate decrease in snow cover depth.
      - value: 20%
        label: Share of the region's population living in areas at high risk of (once-in-a-century) flooding.
      - value: 2021 / 2024
        label: Years in which the region experienced its most severe droughts.
      - value: 2x
        label: 'How much faster than the global average Central Asia''s temperature is rising, accompanied by increased evaporation, glacier melt, and erratic precipitation.'
    intro: |-
      Climate is becoming a "threat multiplier": it intensifies water scarcity, undermines food security, and heightens regional tensions through complex and at times unpredictable interdependencies.

      This interweaving of risks creates a high degree of uncertainty. This means that strategy must be both robust — resilient across a range of possible futures — and adaptive, capable of adjusting and recovering after change. This requires a clear understanding of the region's climate trends, familiarity with the projections, and an awareness of their limitations.

      Temperatures are rising markedly, and this trend is set to continue.

      More detail is available in the book.
    charts:
      - image: /assets/images/uploads/4. Климат.png
        caption: 'Population living in poverty and in areas at high risk of flooding. Source: World Bank (2024).'
        note: ''
      - image: /assets/images/uploads/6. Климат.png
        caption: 'Observed and reconstructed time series of glacier mass balance in Central Asia. Source: Barandun et al. (2020).'
        note: ''
      - image: /assets/images/uploads/7. Климат.png
        caption: 'Map of major mountain ranges and glaciers. Source: Barandun et al. (2020).'
        note: ''
      - image: /assets/images/uploads/5. Климат.png
        caption: 'Total emissions by sector across all five Central Asian countries under the Net Zero and Reference scenarios. Note: the chart on the left reflects the baseline scenario, while the chart on the right reflects the low-carbon development scenario.'
        note: ''
      - image: /assets/images/uploads/3. Климат.png
        caption: 'Projected maximum one-day precipitation for 2065–2085. These ranges show the 10th (low) to 90th (high) percentile of projections for each Shared Socioeconomic Pathway (SSP). Historical ranges cover 1995–2014. Data source: IPCC, 2025.'
        note: ''
    scenarios:
      - title: 'Regional risks:'
        description: |-
          Temperatures in Central Asia are rising nearly twice as fast as the global average, accompanied by increased evaporation, glacier melt, and erratic precipitation.

          Extreme events — droughts, floods, and landslides — are occurring with increasing frequency, threatening infrastructure and vulnerable segments of the population.

          Economic losses from water-related emergencies could reach 1.3% of GDP annually, while crop yields could decline by 30% by 2050.
        outcome: 'Conclusion: without adaptation, the region faces chronic water instability and severe economic losses.'
      - title: Agriculture in Central Asia is particularly vulnerable to climate change.
        description: |-
          Uzbekistan is grappling with land degradation and soil salinization, which, combined with shifting precipitation patterns, is reducing crop yields and threatening food security.

          Tajikistan is experiencing the effects of high variability in water use, which affects irrigation and crop yields.

          In Kazakhstan's northern regions, climate zones are shifting, affecting grain production and pasture quality.

          Kyrgyzstan must contend with heat stress affecting agricultural crops, which is increasing irrigation demand against a backdrop of planned production growth.
        outcome: While rising temperatures and increasingly variable precipitation are disrupting the customary conditions of agricultural production across the region, they are also opening strategic windows for early adaptation and innovation.
      - title: 'Climate change is also affecting the power sector — particularly visible where dependence on hydropower is high:'
        description: |-
          In Tajikistan and Kyrgyzstan, shrinking glaciers and changing precipitation patterns are making river flow volumes harder to forecast, undermining the reliability of hydropower generation.

          Uzbekistan's power system faces a dual pressure: rising demand during periods of extreme heat, combined with constraints on the water needed to cool thermal power plants.

          In Kazakhstan, the energy sector faces both growing cooling demand and the need to shift toward renewable energy to reduce emissions.
        outcome: Climate change is intensifying competition for water among sectors, which calls for careful, forward-looking planning.
    recommendations:
      - text: |-
          Priority is given to "win-win" strategies that deliver benefits across a range of future climate scenarios, increase resilience, reduce vulnerability, and generate relevant co-benefits — such as improved water use, emergency preparedness, and better public health outcomes.
      - text: 'Investment in transport, water supply, and energy must account for extreme weather events: new projects should be designed for increasing precipitation intensity and linked to disaster risk management systems. As a practical priority for protecting critical infrastructure, water supply, energy, and transport systems should be modernized with future climate conditions in mind.'
      - text: |-
          Early warning systems must be established, preparedness systems for floods, landslides, and avalanches developed, and climate risks integrated into the long-term development plans of key sectors. As a practical priority, comprehensive risk and vulnerability assessments are identified for the following sectors:
          agriculture;
          energy;
          water resources;
          healthcare —
          with risk maps for each sector and the development of cross-sectoral action plans.
      - text: |-
          Climate-resilient practices must be introduced — crop diversification, efficient irrigation, soil conservation, crop rotation and fertilization, and afforestation.
          As a practical priority for this track, long-term programs for reforestation and combating desertification are envisaged: land restoration, halting soil degradation, and forming a unified regional strategy for adapting to climate and demographic change.
      - text: 'Agricultural strategies must be aligned with the real availability of water resources: this requires either securing water for planned initiatives or adapting agricultural practices to water scarcity. As a practical priority, a coordinated agricultural and water policy is identified: transitioning to sustainable agricultural practices, expanding the cultivation of less water-intensive crops, and reducing dependence on irrigation.'
  - slug: water
    title: Water resources
    subtitle: Amid intensifying climate pressure, sustainable water management is becoming a decisive condition for economic growth and regional stability.
    stats:
      - value: 97%
        label: Share of Central Asia's water resources accounted for by surface water.
      - value: up to 11%
        label: Potential decline in Central Asia's GDP by 2050 due to the combined impact of climate and socioeconomic factors, if water management policy and practice remain unchanged.
      - value: $4.5 billion
        label: Approximate annual loss to countries of the region from the absence of effective transboundary cooperation.
      - value: 5x
        label: How many times higher the region's overall rate of water use is compared with the global average.
      - value: 80%
        label: Share of water used for irrigated agriculture exceeds this figure.
      - value: 123 billion m³
        label: 'Estimated total annual volume of the region''s potential groundwater reserves, of which only 23% is currently used.'
      - value: 10 million
        label: People in the region lack access to safe drinking water.
    intro: |-
      Despite national reforms, the region still faces a pressing need to deepen dialogue and coordination in order to make effective use of its water potential.

      The region's challenges extend far beyond simple water scarcity, touching on economic stability, public health, social cohesion, and transboundary relations.

      Rising temperatures increase the water requirements of agricultural crops, placing further strain on water systems and raising the risk of water scarcity.

      Effective groundwater management requires a comprehensive and sustainable approach that includes improved monitoring and regulation of water use. Overlapping and duplicated mandates among government agencies hinder optimal decision-making.
    charts:
      - image: /assets/images/uploads/1. ВОда.png
        caption: 'Strategic overview of water scarcity challenges in Central Asia. Source: World Bank, 2024.'
        note: ''
      - image: /assets/images/uploads/2. Вода.png
        caption: 'Costs of limited regional cooperation on water resources. Source: Adelphi and CAREC (2017).'
        note: ''
      - image: /assets/images/uploads/3. Вода.png
        caption: "Irrigated land area in Central Asia — each country's share (%) of the region's total area (10.1 million ha). Source: World Bank, 2024."
        note: ''
      - image: /assets/images/uploads/4. вода.png
        caption: 'Coordinated and optimized operation of the reservoir cascade supports water and energy security both under current conditions and under climate change. Source: World Bank, 2020.'
        note: ''
      - image: /assets/images/uploads/5. вода.png
        caption: 'Wastewater across Central Asian countries: volumes collected, treated, and reused. Source: World Bank, 2024.'
        note: ''
    scenarios:
      - title: The impact of climate change
        description: 'Unilateral development by upstream countries, combined with a lack of regional cooperation, creates serious risks for Central Asia. The first risk stems from unilateral projects being carried out in Afghanistan. For example, once construction of the Qosh-Tepa Canal is complete, an estimated 10–16 billion m³ of water is expected to be diverted from the Amu Darya each year — a development that would significantly affect water supply for agriculture in Uzbekistan and Turkmenistan, as well as hydropower generation at the Tuyamuyun Hydro Complex (THC), located on the same border. Inflow to the THC is projected to fall by 25%, water delivery to agriculture to shrink by roughly 6%, and annual hydropower generation to decline by roughly 22%. This illustrates how closely tied the energy sector is to upstream water withdrawals.'
        outcome: This cluster of risks stems from a lack of cooperation in the region — from insufficient trust among states, inadequate capacity of regional institutions, and the absence of effective coordination for the joint use of water resources.
      - title: Global and regional uncertainty in energy, economics, demography, and geopolitics
        description: |-
          Sustainable water management is becoming more complex under the influence of various external factors. Changes in energy prices and geopolitical shifts can sharply increase the cost of pumping water, raising the burden on the economics of water supply, on state budgets, and on end users.

          Agricultural losses could push countries toward strategies of food self-sufficiency, increasing demand for water and intensifying competition between hydropower and irrigation.

          Demographic factors also add to the uncertainty: population growth, migration (including from neighboring countries), fertility rates, prosperity, and education all directly affect water consumption.
        outcome: Mass migration could cause an unexpected surge in demand for water and electricity, creating additional challenges for resource planning and management.
    recommendations:
      - text: |-
          To address the identified challenges and create conditions for the region's sustainable development, governments have focused on four key areas:
          improving water use efficiency;
          introducing new financial instruments;
          digitalizing the water sector;
          modernizing and rehabilitating existing water infrastructure.
      - text: |-
          Governments could revise the rules governing the operation of water infrastructure to find compromise solutions and ensure effective management amid climate change and shrinking glacier reserves. Existing approaches include:
          joint investment by upstream and downstream countries in reservoirs, the creation of shared infrastructure, and the development of coordinated operating rules;
          the protection and management of groundwater to partially offset the loss of snow and glacier reserves during the summer and winter seasons.
      - text: The further development of Central Asian countries depends on making the most efficient use of existing water and energy resources amid climate change, population growth, and rising demand. During the Soviet era (1960s–1980s), a unified water-energy system and interconnected infrastructure were built, forming the basis for cooperation and coordinated commitments among the countries of the region. After the collapse of the Soviet Union, these states developed new water-energy relations that accounted for state sovereignty and market principles.
      - text: "Many of Central Asia's water facilities — reservoirs, hydropower plants, canals, and water intake structures — are located on the border between two states and are jointly operated or maintained. To manage them effectively, countries conclude bilateral agreements governing joint operation, maintenance, and financing. The key elements of successful cooperation are improved monitoring, water accounting, and transparent data exchange. Digital technologies and remote sensing can complement traditional measurements, improving the completeness and reliability of data."
      - text: Effective water resource management requires revising irrigation norms, optimally allocating water among agricultural crops, and redesigning cropping patterns to reflect local hydro-climatic conditions and market opportunities. This helps not only to reduce water scarcity but also to encourage water conservation and improve agricultural productivity. Additional investment aimed at improving irrigation efficiency is essential for ensuring food security and sustainable economic growth.
      - text: To increase investment in water infrastructure and improve service quality, countries are exploring mechanisms for private-sector participation. Approaches already in use include handing pumping stations over to investors for modernization and operation, as well as managing on-farm irrigation systems at the level of agricultural water-user clusters.
      - text: Reducing water demand and easing water scarcity in the region requires investment in modernizing irrigation infrastructure and adopting advanced technologies such as drip and sprinkler irrigation. Combined with water accounting and the introduction of consumption limits, these measures will help promote more rational water use and reduce losses.
      - text: |-
          Existing reservoir infrastructure has considerable potential to improve efficiency through flexible management strategies and data-driven approaches. Research shows, for example, that incorporating seasonal hydrometeorological forecasts into operational decision-making at the Nurek Reservoir could increase annual
          hydropower generation by 13–14%, while also helping to reduce flood risk. This example demonstrates that transparent, data-driven approaches can simultaneously achieve several goals: optimizing energy supply, managing water risks, and equitably allocating water among competing sectors.
  - slug: energy
    title: Energy
    subtitle: Among Central Asia's energy resources, natural gas and electricity hold particular strategic importance.
    stats:
      - value: 80% / 50%
        label: 'Turkmenistan accounts for more than 80% of the region''s proven gas reserves and 50% of its gas production.'
      - value: 155 billion m³
        label: Combined gas production across the five Central Asian republics in 2022 — nearly four times the volume of the European Union and comparable to Australia, the world's seventh-largest gas producer.
      - value: '"Central Asia–China"'
        label: 'The "Central Asia–China" pipeline: the largest share of exports is delivered to China through its three lines.'
      - value: 2.8 billion m³
        label: Volume of gas per year Uzbekistan began importing from Russia starting in 2023.
      - value: Azerbaijan
        label: Since 2022, under a trilateral agreement, Turkmenistan has also begun supplying small volumes of gas to Azerbaijan via Iran.
    intro: |-
      Regional integration of energy and transport can deliver substantial economic benefits — chiefly by reducing the need for investment in power generation and lowering fuel costs.

      Despite renewed interest in regional cooperation, the potential for interconnection and energy trade remains largely untapped. Key obstacles include the absence of an effective regional trading platform, outdated infrastructure, and institutional fragmentation. Strengthening cooperation on electricity, gas, and other energy resources would enhance the region's energy security, transparency, and resilience — a necessary condition for sustaining the economic well-being of a rapidly growing population.

      Since 2018, surplus gas volumes in the region have been shrinking as production has slowed markedly while domestic consumption grows rapidly. Uzbekistan and Kazakhstan, as the region's leading exporters, have sought to maintain a positive trade balance in recent years, but preliminary data indicate that Uzbekistan became a net gas importer in 2023 for the first time since independence. Turkmenistan — particularly as it develops the second stage of the Galkynysh gas field — retains substantial untapped export potential, though the fate of the proposed Line D pipeline, with an annual capacity of 30 billion m³, remains uncertain.
    charts:
      - image: /assets/images/uploads/1. Энергетика.png
        caption: 'Wastewater across Central Asian countries: volumes collected, treated, and reused. Source: World Bank, 2024. Note: gas production volume is shown in grey, consumption in yellow; the red line indicates the level of gas exports.'
        note: ''
      - image: /assets/images/uploads/2. энергетика.png
        caption: 'Intraregional and external gas trade in Central Asia, 2022. Source: Statistical Review of World Energy 2024, Energy Institute; International Energy Agency.'
        note: ''
      - image: /assets/images/uploads/3. энеретика.png
        caption: Energy production by country, 2025, PJ.
        note: ''
      - image: /assets/images/uploads/4. Энергетика.png
        caption: 'Central Asia''s low-carbon policy pathway: key milestones and opportunities. In the background — total emissions by sector (MtCO2eq). Source: World Bank energy system model. Note: the chart focuses on the main energy-consuming sectors and does not cover emissions from mining, agriculture, hydrogen production, or on-site energy-sector operations.'
        note: ''
    scenarios:
      - title: Financial and market constraints
        description: |-
          Weak financial performance in the energy sector is slowing the deployment of renewable energy and other technologies.
          The sector is in transition: market reforms are ongoing, but low price signals are constraining investment.
        outcome: Private investors face regulatory and market uncertainty, as well as data gaps, which slows the deployment of technologies and the transfer of knowledge.
      - title: Risk of energy shortages
        description: Insufficient infrastructure investment, climate change (seasonal droughts), and the absence of regional coordination could deepen winter gas and electricity shortages in Tajikistan, Kyrgyzstan, and Uzbekistan.
        outcome: The situation is likely to improve only by the early 2030s, once new hydropower capacity comes online in Tajikistan and Kyrgyzstan and solar and wind generation are developed at scale in Uzbekistan.
      - title: Air pollution
        description: |-
          Air quality is particularly poor in cities, where PM2.5 concentrations are frequently 6 to 12 times higher than the WHO-recommended level of 5 µg/m³.
          In major cities (Bishkek, Dushanbe, Tashkent, Almaty), PM2.5 levels are twice the WHO interim target of 35 µg/m³.
          Pollution levels are lower in rural areas owing to lower population density, but ongoing urbanization is intensifying the problem.
        outcome: 'Electric vehicles and heat pumps are expected to see widespread adoption: by 2050, the number of electric vehicles could reach 20 million, and the share of households using heat pumps is expected to exceed 50%.'
    recommendations:
      - text: |-
          Reducing costs and increasing economic benefits:
          countries can lower electricity generation costs, import inexpensive electricity during periods of peak demand, and export surplus generation during periods of low demand, thereby making efficient use of differences in timing and seasonal demand.
          Regional electricity and gas trade is projected to generate economic benefits of up to US$6.4 billion between 2020 and 2030.
      - text: |-
          Strengthening energy security:
          interconnected grids enable diversification of supply sources and reduce dependence on a single fuel type or domestic production, thereby enhancing the resilience of regional energy systems.
      - text: |-
          Integrating renewable energy sources:
          regional trade facilitates the integration of variable renewable sources — including solar power in Uzbekistan and wind power in Kazakhstan — balancing generation and demand across borders.
      - text: |-
          Reducing pollution and greenhouse gas emissions:
          replacing polluting fuels at scale with imports of clean hydro and renewable power, or with gas, reduces air pollution and greenhouse gas emissions.
      - text: |-
          Optimizing the efficient use of infrastructure:
          cross-border trade allows for maximum utilization of existing and new energy assets, reducing the need for additional domestic investment.
      - text: |-
          Institutionalizing cooperation through the establishment of a Central Asian Energy Council.
          To ensure regional energy security, the existing mechanism of consultative meetings among energy ministers should be transformed into a standing Energy Council.
          This would allow a shift from consultation to practical, systematic cooperation, help form a unified approach to managing regional energy resources, and create an institutional foundation for long-term, binding decisions.
      - text: Developing and implementing long-term national strategies covering energy policy, financing, and incentive mechanisms.
      - text: Establishing and developing competitive electricity markets.
  - slug: transport
    title: Transport
    subtitle: Central Asia occupies a unique geostrategic position. This role was once played by the Great Silk Road, which linked Europe with China and India.
    stats:
      - value: 10 million tons
        label: Projected freight volume via the Middle Corridor by 2030.
      - value: 900 km
        label: 'The China–Kyrgyzstan–Uzbekistan railway shortens the route connecting East Asia and Europe by this distance.'
      - value: '500,000 TEU'
        label: 'Annual capacity of the "Khorgos" dry port in Kazakhstan.'
      - value: 30%
        label: Share of roads in Kyrgyzstan and Tajikistan unsuitable for year-round use.
      - value: 4x
        label: Projected increase in transit freight volume through Central Asia by 2050.
    intro: |-
      Today, the transport routes of the Central Asian countries are being restored and modernized in line with contemporary economic, technological, and logistical standards.

      Because the region is landlocked, transport and logistics connectivity must become one of the central pillars of its development. The time may have come to develop a unified regional transport strategy that brings together existing corridors, export routes, and domestic connections. In effect, this is about the central nodes of the Eurasian continent. At the same time, the region's current position in world trade falls well short of its potential: although annual trade turnover between Europe and East Asia exceeds US$1.5 trillion, Central Asia's share of it remains below 3%.

      The gap between the region's potential and its actual standing stems from a number of factors — inadequate infrastructure development, institutional barriers, and a lack of coordination among the countries of the region. Yet it is precisely in this gap that enormous potential lies.
    charts: []
    scenarios:
      - title: Developing Central Asia's transport system is bound up with geopolitical, institutional, and financial risks
        description: Existing transport routes — including the northern route via Kazakhstan and Russia, and the central corridor via the Caucasus or China — show a high degree of dependence on external factors. Geopolitical instability, sanctions-related restrictions, infrastructure bottlenecks, and differing technical standards all create the risk of disrupted supply routes and rising logistics costs.
        outcome: ''
      - title: The region's financing needs are substantial
        description: |-
          According to the Asian Development Bank, modernizing transport systems will require
          approximately US$500 billion by 2030. Under CAREC, 22 transport projects have already been implemented (worth US$6.1 billion between 2001 and 2024); China has invested more than US$20 billion under its Belt and Road Initiative; and the EU, under its Global Gateway program, has announced plans to invest up to €10 billion in developing the Trans-Caspian route.
        outcome: 'This promising corridor comprises two main railway routes: Route I — via Termez–Mazar-i-Sharif–Herat to the ports of Bandar Abbas and Chabahar; Route II — via Termez–Naibobod–Maidan Shahr–Logar–Kharlachi, both still at the design and negotiation stage. The estimated cost of the Trans-Afghan Railway (647 km) to Pakistani ports is put at US$4.6 billion. Expected freight volume along these two corridors is around 10 million tons a year, potentially rising to 40 million tons over the following decade. Preliminary estimates suggest that transit time through this corridor would fall from 35 days to 3–5 days, while container shipping costs would nearly halve.'
      - title: 'In some countries of the region — for example, Kyrgyzstan and Tajikistan — the bulk of external financing comes from a single partner'
        description: While such a high concentration of resources makes it possible to implement major infrastructure projects, it also highlights the importance of diversifying funding sources and expanding public-private partnership (PPP) instruments to strengthen resilience.
        outcome: ''
      - title: Institutional development
        description: According to World Bank and regional analytical data, in 2023 (the most recent available report) the Central Asian countries differ markedly on the Logistics Performance Index (LPI). Kazakhstan posts the best result, ranking 79th out of 139 countries with a score of 2.7 — the region's highest. Uzbekistan ranks 88th with a score of 2.6, reflecting moderate improvement in recent years. Tajikistan ranks 97th (around 2.5), remaining in the lower part of the ranking, while Kyrgyzstan — with a score of around 2.3 and a rank of 123rd — records the lowest logistics performance among the Central Asian countries.
        outcome: ''
      - title: Environmental modernization
        description: |-
          Road transport currently accounts for approximately 70% of the region's freight turnover, reflecting a heavy reliance on this mode of transport. At the same time, this creates
          substantial scope for shifting toward rail and multimodal solutions, fully in line with the global "green logistics" agenda.
        outcome: ''
      - title: Social connectivity
        description: |-
          The development of trunk transport corridors is proceeding at a rapid pace, laying a solid foundation for future growth. At the same time, this underscores the importance of expanding
          regional and local infrastructure, since doing so brings rural and mountainous areas into the overall transport system and allows a broader range of people to benefit from transit.
        outcome: If the development of transport systems is carried out in coordination among the countries of the region, Central Asia could become one of Eurasia's key transit hubs. Forecasts suggest that, with successful project implementation, transit freight volumes could grow 3–4 times by 2050, the region's share of Eurasian transit could rise from 3% to 8–10%, and annual revenue from transport could reach US$25–30 billion. At the same time, increasing rail's share to 55–60% would cut the carbon footprint by 35–40%, while the transport and logistics sector's contribution to regional GDP could reach 1.5–2% annually.
    recommendations:
      - text: |-
          Particular attention should be given to increasing rail's share of freight from the current 30% to 45–50% by 2035, which will require large-scale railway electrification, the procurement of modern rolling stock, and accelerated
          development of container services. Establishing multimodal hubs and dry ports — such as Khorgos, Aktau, Tashkent, and Khujand — should be carried out in close coordination with national and regional transport networks, allowing for a unified system of freight distribution and reducing the burden on individual links. Key priorities remain the construction and reconstruction of international highways, improved access roads to logistics centers, and an expanded network of electrified railways.
      - text: |-
          Even where modern infrastructure exists, the region's transit potential may go unrealized without institutional reform. Adopting international digital standards such as e-TIR and e-CMR,
          along with establishing electronic data exchange with neighboring countries (Kazakhstan, Kyrgyzstan, Tajikistan, and Afghanistan), would reduce transaction costs, speed up cargo clearance, and lower corruption risks. Another important priority is developing border-crossing infrastructure: building additional logistics centers and equipping them with modern cargo control and inspection equipment.
      - text: 'Ensuring long-term sustainability requires diversifying funding sources by combining resources from the European Union, the ADB, the World Bank, the EBRD, and national funds. Developing public-private partnership mechanisms is particularly important, with their share of transport project financing expected to reach 20–25% by 2030. A key condition for this is greater transparency in managing external debt and the systematic evaluation of project effectiveness, taking into account their socioeconomic impact.'
      - text: Uncoordinated action by individual states cannot unlock the region's full potential — this requires coordinated measures at the regional level. The absence of shared strategies leads to project duplication and undermines Central Asia's competitiveness as a unified transit space. An important step in this direction would be creating a regional coordination mechanism to standardize technical parameters, tariffs, and infrastructure access rules, while enabling joint financing.
      - text: Successfully implementing transport and logistics projects in the region requires establishing the Council for Infrastructure Development proposed by the President of Uzbekistan, along with a dedicated Fund for financing priority regional projects. This systemic approach would help synchronize strategies and attract investment effectively.
  - slug: demography
    title: Social development and demography
    subtitle: Central Asia is at a critical stage of demographic change.
    stats:
      - value: 144 million
        label: Population of the region projected to exceed this figure by 2050.
      - value: 71 million
        label: Working-age population (15–64 years) projected to reach this figure.
      - value: 0–14
        label: Children in this age group account for nearly a third of Central Asia's population today.
    intro: |-
      Capturing the demographic dividend is not an automatic process but the result of sound investment and political will. It requires, above all, bold investment in education, health care, and expanding opportunities for young people and women. Only under these conditions can accelerated economic growth and the full realization of women's potential in the labor market be achieved.
      Over the longer term, according to projections by the United Nations Department of Economic and Social Affairs (UN DESA) and the United Nations Population Fund (UNFPA), population growth will slow and the number of older people will rise — signaling a shift in countries' demographic structure and a limited window for capturing the demographic dividend.

      At the same time, the growing share of older people in the overall population calls for additional investment in the social sphere and flexible policies capable of meeting the needs of both young and older generations simultaneously.

      Fully integrating and implementing the concept of demographic resilience would make it possible to effectively manage changes in age structure, migration flows, fertility, and life expectancy across the region — underpinning sustainable development, economic stability, and social well-being.

      By making strategic decisions today, Central Asia can turn its demographic momentum into a foundation for long-term prosperity, innovation, and regional solidarity.
    charts:
      - image: /assets/images/uploads/1. Демография.png
        caption: Current and projected population growth scenarios for Central Asia (2000–2050)
        note: ''
      - image: /assets/images/uploads/2. Демография.png
        caption: Current and projected population growth scenarios for the world (2000–2050).
        note: ''
      - image: /assets/images/uploads/3. Демография.png
        caption: Current and projected population growth scenarios for Asia (2000–2050).
        note: ''
      - image: /assets/images/uploads/4. Демография.png
        caption: Current and projected population growth scenarios for Europe (2000–2050).
        note: ''
      - image: /assets/images/uploads/5. Демография.png
        caption: Labor force participation rate (2024).
        note: ''
      - image: /assets/images/uploads/6. Демография.png
        caption: 'Share of youth not in education, employment, or training (NEET indicators, 2024).'
        note: ''
    scenarios:
      - title: Population growth forecast
        description: 'UN DESA demographic scenarios project sustained population growth for Central Asia through 2050. Even the region''s "low" scenario exceeds the "high" scenario for the world, for Asia, and especially for Europe. Under the "medium" growth projection, Central Asia''s working-age population (15–64) will grow from 50 million to 71 million, with its share of the total population rising from 62% today to 63% by 2050. By comparison, between 2023 and 2050 the working-age share is projected to fall from 67% to 64% in Asia and from 64% to 58% in Europe.'
        outcome: ''
      - title: Demographically sustainable development
        description: According to the forecast, if labor force participation reaches the 2024 global average by 2050, an additional 2.4 million people could enter the labor market. Given the creation of decent jobs, this would contribute to GDP growth and help reduce poverty as well as gender, regional, and age-related inequality.
        outcome: Key priorities include investment in health care, education, and skills development, as well as active employment policies geared toward the digital and green economies. Under these conditions, the region's young people would be able to realize their full potential, driving accelerated economic growth and progress toward the Sustainable Development Goals.
      - title: Inclusive development
        description: 'Without investment in an inclusive labor market, there is a risk of a "lost generation" denied opportunities for development.'
        outcome: ''
      - title: Gender equality and women's empowerment
        description: |-
          In Central Asia, the demographic dividend cannot be fully realized without the complete integration of women into the economy. The 22-percentage-point gap between the labor force participation rates of women and men (2024) points to substantial macroeconomic losses.

          Key barriers include high fertility rates, limited access to family planning services, a shortage of childcare services, inflexible labor market conditions, caregiving responsibilities for elderly relatives, and factors that hinder women's education and careers. Together, these erode women's qualifications and push them toward informal employment.

          A number of countries in the region have carried out reforms, including lifting bans on women's employment in heavy industry and introducing subsidies for women-led enterprises. Yet the principal barrier — unpaid domestic labor — persists, and legal measures alone cannot resolve it.
        outcome: "Targeted investment in women's human capital — through the development of social infrastructure and gender-responsive employment — is the key to fully realizing the \"gender dividend.\""
      - title: Active aging and longevity
        description: |-
          Women live longer than men, but employment in the informal sector and interruptions in their working lives leave them with smaller pension savings, contributing to the "feminization of poverty." Possible solutions include gender-responsive
          pension reform, expanded social protection, the formalization of women's employment, and recognition of unpaid labor.
        outcome: Using demographic projections to plan health and social protection systems is essential, as it allows for the timely reorientation of services toward gerontological care and supports opportunities for older people to remain employed and actively engaged in public life.
      - title: Migration and mobility
        description: |-
          Migration plays an important role in Central Asia's development. Historically, the region has experienced large-scale migration flows — from rural-to-urban migration and Soviet-era resettlement to today's external and circular labor migration.
          For Kyrgyzstan and Tajikistan, labor migration remains vital: both countries rank among the world leaders in remittances as a share of GDP, a large portion of which comes from current and former migrants.

          A similar but somewhat less pronounced trend is observed in Uzbekistan. Kazakhstan, by contrast, is becoming a destination hub for migrants from neighboring countries. However, high levels of informal and irregular employment make migrants
          one of the most vulnerable social groups, and their children often become "social orphans," facing risks of inadequate care and marginalization.
        outcome: ''
    recommendations:
      - text: |-
          Increasing investment in women's human capital.

          Scaling up state and regional financing for health care, education, and skills development, with priority given to ensuring equal opportunities for women and disadvantaged young people, particularly in rural areas. It is also important to include support measures for girls, children with disabilities, and young women who are neither in education nor employment. Incorporating gender considerations into budgeting and reform processes will improve investment effectiveness and reduce inequality.

          Integrating family-friendly and reproductive policies into labor market development strategies. This includes ensuring broad, convenient access to reproductive health services and introducing paid parental leave, flexible working hours, and affordable preschool education as family support measures. These initiatives simultaneously strengthen women's employment, fertility stability, labor productivity, and population well-being.
      - text: |-
          Economic integration and expanded opportunities for young people.

          Developing youth employment strategies that reflect demographic trends. Programs for developing digital, green, and social skills are important, along with measures to expand youth access to the labor market, microfinance, mentorship, and startups — including cross-border innovation clusters.
          Establishing regional scholarship and academic mobility programs. Interstate funds and exchange programs give young people, including those from rural and underserved communities, the opportunity to study at the region's leading universities,
          while strengthening regional identity and building a network of future leaders.

          Strengthening cross-border cooperation on youth policy and security. Programs for preventing extremism and fostering civic participation, media literacy, and critical thinking need to be developed, particularly in border areas with mixed ethnic composition. This strengthens young people's resilience and their role
          in building a safe and inclusive region.
      - text: |-
          Expanding labor market participation and creating decent jobs.

          Introducing regional mechanisms for skills recognition and unified educational standards. This will simplify cross-border employment and reduce the scale of informal migration.
          Creating jobs in the green economy and the care sector. Investment in renewable energy, sustainable agriculture, waste recycling, and elderly and child care reduces unemployment and supports the Sustainable Development Goals.

          Removing barriers to women's economic participation. Reforms are needed that simplify business registration, expand women's employment, and encourage employers to provide access to childcare and eldercare services.
      - text: |-
          Preparing for an aging population.

          Modernizing pension and long-term care systems. This is essential to ensure financial sustainability, fairness, and unimpeded access to services for everyone — particularly women and informal-sector workers.

          Promoting active aging. Retraining, mentorship, digital education, and the exchange of volunteering experience give older people the opportunity to contribute to economic and social development.

          Expanding regional dialogue on aging. Joint demographic forecasting, statistical exchange, and expert consultations help adapt social and economic systems to changing conditions.
      - text: |-
          Safe and effective migration.

          Coordinating migration policy and the protection of migrants' rights. Mutual recognition of qualifications, standardized labor contracts, and legal protection mechanisms are particularly important for women and young people.
          Advancing the principle of extraterritoriality for social benefits and services. Bilateral and regional agreements should guarantee migrants and their families the preservation of accrued pension entitlements, as well as access to health care and education.

          Facilitating mobility through digital ID and modern infrastructure. Such tools increase transparency and simplify movement for young people, students, and professionals.
      - text: |-
          Demography and climate resilience.

          Integrating demographic factors into climate strategies.

          This applies above all to urban planning, water supply, and food security.
          Strengthening regional cooperation on natural resource management. Cooperation within the Aral Sea basin — on water, land, and ecosystems — is especially important.

          Developing early warning systems that account for gender and age-specific needs. Women and young people should be at the center of demographic
          adaptation efforts.
      - text: |-
          Applying demographic analysis in planning.

          Strengthening regular population censuses and forecasting. This allows important changes to be captured in a timely manner and strategies to be adjusted accordingly.

          Harmonizing statistical indicators. Aligned methodologies facilitate cross-border analysis and joint planning.

          Establishing regional demographic centers. These would coordinate data analysis, research, and the preparation of evidence-based recommendations for sustainable development.
