intro:
  - "This book is the outcome of the first regional foresight dialogue in the history of independent Central Asia. For the first time, representatives of the five countries' leading analytical centers and independent experts came together to analyze the region's key challenges and opportunities and to propose visions of its future through 2050."
  - "The book is structured around four priority tracks — water and climate change, energy, transport links, and demography — complemented by a dedicated chapter giving voice to the region's youth."
