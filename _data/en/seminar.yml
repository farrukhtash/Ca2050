tab_title: Foresight Seminar 2025
hero_eyebrow: First regional event on foresight methodology
hero_title: Foresight Seminar 2025
hero_dates: 27–28 May 2025, Tashkent
hero_organizers: |-
  Seminar organizers: the Agency for Strategic Development and Reforms under the President of the Republic of Uzbekistan, the Institute for Strategic and Interregional Studies under the President of the Republic of Uzbekistan, and the International Institute of Central Asia.

  The seminar was organized with the financial support of the Delegation of the European Union to Uzbekistan.
about_eyebrow: About the seminar
about_h2: A joint dialogue among regional experts
about_paragraphs:
  - text: As part of the Foresight Seminar, representatives of analytical centers and independent experts from the five countries gathered in Tashkent for two days to discuss scenarios for the region's future through 2050. The event became one of the key milestones in preparing the book "Central Asia States 2050."
  - text: Participants worked in group sessions on water and climate change, energy, transport connectivity, and demography, shaping key findings and recommendations for each track.
quotes_eyebrow: Voices from the seminar
quotes_h2: Key quotes
quotes:
  - photo: /assets/images/uploads/wlmiNr17484131524319_b.jpg
    name: Bakhodir Rakhmatov
    position: former Director of the Agency for Strategic Development and Reforms under the President of the Republic of Uzbekistan
    quote: "«Gathered here are not simply people, but those prepared to view the future not in abstract terms, but through the lens of data, strategy, decision-making, and reform.»"
  - photo: /assets/images/uploads/toivo_klaar.jpg
    name: Toivo Klaar
    position: Ambassador Extraordinary and Plenipotentiary of the European Union to Uzbekistan
    quote: '«In the European Union, when we speak of cooperation among member states, we often use the phrase "Together we are stronger." We firmly believe that this principle applies equally to the countries of Central Asia.»'
  - photo: /assets/images/uploads/beIQON17484134392974_l.webp
    name: Akramjon Nematov
    position: First Deputy Director of the Institute for Strategic and Interregional Studies under the President of the Republic of Uzbekistan
    quote: "«In recent years, dialogue among experts across the region has intensified considerably. Meetings of this kind, especially against the backdrop of growing and prolonged instability in world politics, offer an opportunity to get to know one another more closely and to discuss key questions of cooperation.»"
  - photo: /assets/images/uploads/lVladI17484149174974_b.jpg
    name: Aziza Umarova
    position: Head of the Zero Bureaucracy-2030 and Innovations Office at the Agency for Strategic Reforms under the President of the Republic of Uzbekistan
    quote: "«It is important that the work of the seminar's participants not be confined to theory alone. The principal task is to prepare concrete recommendations for the desks of heads of state.»"
  - photo: /assets/images/uploads/eUh6RL17484139719633_b.jpg
    name: Sherzod Fayziev
    position: Deputy Director of the International Institute of Central Asia
    quote: "«We have counted nearly 300 initiatives put forward by heads of state. This is evidence of a serious commitment to developing regional cooperation and addressing shared challenges.»"
  - photo: /assets/images/uploads/gDLkHw17484149215956_b.jpg
    name: Aida Karazhanova
    position: Foresight expert
    quote: "«Foresight is a method of strategic forecasting that, drawing on the analysis of current trends and expert judgment, helps build scenarios for the future and account for risks that may arise.»"
