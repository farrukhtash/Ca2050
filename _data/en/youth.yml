concepts:
  - title: Hashar (ashar, asar)
    description: |-
      Hashar is a traditional form of voluntary collective labor, widespread in Uzbekistan and other Central Asian countries and rooted in mutual aid and solidarity. Neighbors come together to clear irrigation ditches, repair roofs, or bring in the harvest before the cold sets in. The essay's
      author argues that this very tradition means the region already has a working template for mutual assistance and the shared management of common resources — whether that means water today or data networks tomorrow.
