intro_text: |-
  The book includes a dedicated chapter devoted to the region's youth — bringing together their essays and reflections on the future of Central Asia through 2050.

  Young people from across the region's countries were invited to describe their homeland's future freely — as an essay, a personal observation, or an analysis. Their texts complement the book's formal analytical sections, adding a broader public perspective.
