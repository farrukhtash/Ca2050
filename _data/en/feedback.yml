hero_title: Leave your feedback
hero_sub: Have you read the book? Share your thoughts on it, its conclusions, and the region's future — every comment matters to us.
intro_paragraphs:
  - text: '"Central Asia States 2050" is the beginning of an open conversation about the region''s future, not its conclusion. We want to know what you took away from the book and what questions it raised — your input helps us improve the underlying research and future editions.'
  - text: Use the short survey below to tell us which sections you found most useful, what felt missing, and which aspects of the region's future deserve deeper coverage. It only takes a few minutes.
