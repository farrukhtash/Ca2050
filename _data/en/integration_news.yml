  - image: /assets/images/uploads/photo_2026-09-11_16-29-25.jpg
    title: First-ever "Korea–Central Asia" summit to be held
    description: |-
      On September 14, Shavkat Mirziyoyev will meet with South Korean President Lee Jae-myung in Seoul.

      On September 16, the first-ever "Korea–Central Asia" summit will take place, bringing together the leaders of all five Central Asian states.

      The topics under discussion include critical minerals, energy, artificial intelligence, and business cooperation.
