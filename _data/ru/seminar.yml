hero_eyebrow: Первое региональное мероприятие по форсайт-методологии
hero_title: Форсайт-семинар 2025
hero_dates: 27–28 мая 2025 года, г. Ташкент
hero_organizers: |-
  Организаторы семинара: Агентство стратегического развития и реформ при Президенте Республики Узбекистан, Институт стратегических и межрегиональных исследований при Президенте Республики Узбекистан, Международный институт Центральной Азии.

  Семинар организован при финансовой поддержке Представительства Европейского союза в Узбекистане.
about_eyebrow: О семинаре
about_h2: Совместный диалог экспертов региона
about_paragraphs:
  - text: В рамках форсайт-семинара представители аналитических центров и независимые эксперты пяти стран в течение двух дней работали в Ташкенте, обсуждая сценарии будущего региона до 2050 года. Мероприятие стало одним из ключевых этапов подготовки книги «Государства Центральной Азии 2050».
  - text: Участники работали в тематических группах по вопросам воды и изменения климата, энергетики, транспортных связей и демографии, вырабатывая ключевые выводы и рекомендации по каждому направлению.
quotes_eyebrow: Мнения участников
quotes_h2: Ключевые цитаты
quotes:
  - photo: /assets/images/uploads/wlmiNr17484131524319_b.jpg
    name: Баходир Рахматов
    position: бывший директор Агентства стратегического развития и реформ при Президенте Республики Узбекистан
    quote: «Здесь собрались не просто люди, а те, кто готов смотреть на будущее не абстрактно, а через призму данных, стратегий, решений и реформ.»
  - photo: /assets/images/uploads/toivo_klaar.jpg
    name: Тойво Клаар
    position: Чрезвычайный и Полномочный Посол Европейского союза в Узбекистане
    quote: '«В Европейском союзе, говоря о сотрудничестве между государствами-членами, мы часто используем фразу "Вместе мы сильнее". Убеждены, что этот принцип в равной степени применим и к странам Центральной Азии.»'
  - photo: /assets/images/uploads/beIQON17484134392974_l.webp
    name: Акрамжон Неъматов
    position: первый заместитель директора Института стратегических и межрегиональных исследований при Президенте Республики Узбекистан
    quote: «В последние годы диалог между экспертами региона заметно активизировался. Подобные встречи, особенно на фоне усиливающейся и затяжной нестабильности в мировой политике, дают возможность лучше узнать друг друга и обсудить важнейшие вопросы сотрудничества.»
  - photo: /assets/images/uploads/lVladI17484149174974_b.jpg
    name: Азиза Умарова
    position: Руководитель офиса «Ноль бюрократии — 2030» и инноваций Агентства стратегических реформ при Президенте Республики Узбекистан
    quote: «Важно, чтобы работа участников семинара не ограничивалась теорией. Главная задача — подготовить конкретные рекомендации, которые лягут на стол руководителям государств.»
  - photo: /assets/images/uploads/eUh6RL17484139719633_b.jpg
    name: Шерзод Файзиев
    position: заместитель директора Международного института Центральной Азии
    quote: «Мы насчитали около 300 инициатив, выдвинутых главами государств. Это свидетельствует о серьёзном намерении развивать региональное сотрудничество и решать общие задачи.»
  - photo: /assets/images/uploads/gDLkHw17484149215956_b.jpg
    name: Аида Каражанова
    position: эксперт в области форсайта
    quote: «Форсайт — это метод стратегического прогнозирования, который на основе анализа текущих тенденций и экспертных оценок помогает выстраивать сценарии будущего и учитывать риски, которые могут возникнуть.»
