    description: '27 мая этого года в столице проходит первый региональный форсайт-семинар «Центральная Азия 2050: прокладывая пути к совместному процветанию и стабильности». В семинаре приняли участие представители всех пяти стран региона — государственных органов, аналитических и исследовательских центров, а также независимые эксперты.'
