    title: Мы одной крови — все пятеро
    description: Пять братских народов веками жили бок о бок, пили воду из одного арыка. Но волею судьбы страна была разделена на национальные республики, проведены границы. Сегодня мы начинаем осознавать, что на самом деле были одной семьёй.
