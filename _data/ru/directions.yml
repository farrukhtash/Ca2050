directions:
  - slug: climate
    title: Изменение климата
    subtitle: Понимание динамики изменения климата — ключевой фактор стратегического планирования в Центральной Азии.
    stats:
      - value: 1,2 °C
        label: Примерный рост среднегодовой температуры с середины XX века.
      - value: 20%
        label: Примерное сокращение толщины снежного покрова.
      - value: 20%
        label: Доля населения региона, проживающего в районах с высоким риском наводнений (повторяемостью раз в 100 лет).
      - value: 2021 / 2024
        label: Годы, когда регион пережил сильнейшую засуху.
      - value: 2х
        label: 'Во столько раз быстрее среднемирового показателя растёт температура в Центральной Азии, что сопровождается усилением испарения, таянием ледников и нерегулярностью осадков.'
    intro: |-
      Климат становится «фактором, умножающим угрозы»: он усиливает дефицит воды, подрывает продовольственную безопасность и повышает региональную напряжённость через сложные и порой непредсказуемые взаимосвязи.

      Подобное переплетение рисков порождает высокий уровень неопределённости. Это означает, что стратегия должна быть одновременно надёжной — устойчивой к различным сценариям будущего — и гибкой, то есть способной адаптироваться и восстанавливаться после изменений. Для этого необходимо чёткое понимание климатических тенденций региона, знание прогнозов и учёт их ограничений.

      Температура заметно растёт, и эта тенденция сохранится.

      Подробнее — в книге.
    charts:
      - image: /assets/images/uploads/4. Климат.png
        caption: 'Население, проживающее в бедности и в районах с высоким риском наводнений. Источник: Всемирный банк (2024 г.).'
        note: ''
      - image: /assets/images/uploads/6. Климат.png
        caption: 'Наблюдаемые и реконструированные временные ряды баланса массы ледников Центральной Азии. Источник: Barandun et al. (2020).'
        note: ''
      - image: /assets/images/uploads/7. Климат.png
        caption: 'Карта основных горных хребтов и ледников. Источник: Barandun et al. (2020).'
        note: ''
      - image: /assets/images/uploads/5. Климат.png
        caption: 'Совокупные выбросы по секторам во всех пяти странах Центральной Азии в рамках сценариев Net Zero и Reference. Примечание: график слева отражает базовый сценарий, график справа — сценарий низкоуглеродного развития.'
        note: ''
      - image: /assets/images/uploads/3. Климат.png
        caption: 'Прогнозируемый максимальный суточный объём осадков в 2065–2085 годах. Диапазоны показывают 10-й (нижний) и 90-й (верхний) процентили прогнозов для каждого сценария Shared Socioeconomic Pathways (SSP). Исторический диапазон — с 1995 по 2014 год. Источник данных: МГЭИК, 2025 год.'
        note: ''
    scenarios:
      - title: 'Региональные риски:'
        description: |-
          Температура в Центральной Азии растёт почти вдвое быстрее среднемирового показателя, что сопровождается усилением испарения, таянием ледников и нерегулярностью осадков.

          Экстремальные явления (засухи, наводнения, оползни) происходят всё чаще, создавая угрозу для инфраструктуры и социально уязвимых групп населения.

          Экономический ущерб от чрезвычайных ситуаций, связанных с водой, может достигать 1,3% ВВП в год, а урожайность к 2050 году может снизиться на 30%.
        outcome: 'Вывод: без адаптации регион столкнётся с хронической водной нестабильностью и серьёзными экономическими потерями.'
      - title: Сельское хозяйство Центральной Азии особенно уязвимо к изменению климата.
        description: |-
          Узбекистан сталкивается с деградацией земель и засолением почв, что в сочетании с изменением режима осадков ведёт к снижению урожайности и угрожает продовольственной безопасности.

          Таджикистан испытывает на себе последствия высокой изменчивости водопользования, что сказывается на орошении и урожайности сельскохозяйственных культур.

          В северных регионах Казахстана происходит смещение климатических зон, что сказывается на зерновом производстве и качестве пастбищ.

          Кыргызстан вынужден решать проблему температурного стресса для сельскохозяйственных культур, что повышает потребность в орошении на фоне запланированного роста производства.
        outcome: Хотя рост температуры и изменчивость осадков в целом нарушают привычные условия сельскохозяйственного производства по всему региону, они одновременно открывают стратегические возможности для раннего внедрения адаптационных мер и инноваций.
      - title: 'Изменение климата затрагивает и электроэнергетику — особенно заметно это там, где высока зависимость от гидроэнергетики:'
        description: |-
          В Таджикистане и Кыргызстане сокращение ледников и изменение режима осадков затрудняют прогнозирование объёма речного стока, что подрывает устойчивость гидроэнергетики.

          Энергосистема Узбекистана испытывает двойное давление: рост спроса в периоды экстремальной жары и ограничение доступа к воде, необходимой для охлаждения тепловых электростанций.

          В Казахстане энергетика сталкивается одновременно с ростом потребности в охлаждении и необходимостью перехода на возобновляемые источники энергии для сокращения выбросов.
        outcome: Изменение климата усиливает конкуренцию за воду между секторами, что требует тщательного заблаговременного планирования.
    recommendations:
      - text: |-
          Приоритет отдаётся стратегиям «выигрыш-выигрыш» (win-win), которые приносят пользу при различных сценариях будущего климата, повышают устойчивость, снижают уязвимость и дают соответствующие сопутствующие выгоды (более рациональное использование воды, готовность к чрезвычайным ситуациям, улучшение здоровья населения).
      - text: 'Инвестиции в транспорт, водоснабжение и энергетику должны осуществляться с учётом экстремальных погодных явлений: новые проекты необходимо рассчитывать на рост интенсивности осадков и увязывать с системами управления рисками стихийных бедствий. В качестве практического приоритета по защите критически важной инфраструктуры предусматривается модернизация систем водоснабжения, энергетики и транспорта с учётом будущих климатических условий.'
      - text: |-
          Необходимо создать системы раннего оповещения, развить системы готовности к наводнениям, оползням и сходу лавин, а также включить климатические риски в долгосрочные планы развития ключевых отраслей. В качестве практического приоритета определяется проведение комплексной оценки рисков и уязвимости по следующим секторам:
          сельское хозяйство;
          энергетика;
          водные ресурсы;
          здравоохранение —
          с составлением карт рисков по каждому сектору и разработкой межотраслевых планов действий.
      - text: |-
          Необходимо внедрять климатически устойчивые методы (диверсификация культур, эффективное орошение, сохранение почв, севооборот и внесение удобрений, лесовосстановление).
          В качестве практического приоритета этого направления предусматривается разработка долгосрочных программ озеленения и борьбы с опустыниванием: восстановление земель, преодоление деградации почв и формирование единой региональной стратегии адаптации к изменению климата и демографическим сдвигам.
      - text: 'Стратегии развития сельского хозяйства необходимо согласовывать с реальной доступностью водных ресурсов: требуется либо обеспечить запланированные мероприятия водой, либо адаптировать сельскохозяйственную практику к дефициту воды. В качестве практического приоритета определяется согласованная аграрная и водная политика: переход к устойчивым сельскохозяйственным практикам, расширение посевов менее водоёмких культур и снижение зависимости от орошения.'
  - slug: water
    title: Водные ресурсы
    subtitle: В условиях усиливающегося климатического давления устойчивое управление водными ресурсами становится решающим условием экономического роста и региональной стабильности.
    stats:
      - value: 97%
        label: Такая доля водных ресурсов Центральной Азии приходится на поверхностные воды.
      - value: до 11%
        label: Возможное снижение ВВП Центральной Азии к 2050 году под совокупным влиянием климатических и социально-экономических факторов, если политика и практика управления водными ресурсами останутся неизменными.
      - value: 4,5 млрд $
        label: Примерно столько ежегодно теряют страны региона из-за отсутствия эффективного трансграничного сотрудничества.
      - value: 5х
        label: Во столько раз общий уровень водопользования в регионе превышает среднемировой показатель.
      - value: 80%
        label: Более этой доли воды расходуется на орошаемое земледелие.
      - value: 123 млрд м³
        label: 'Оценивается общий годовой объём потенциальных запасов подземных вод региона, из которых используется лишь 23%.'
      - value: 10 млн
        label: Столько человек в регионе лишены доступа к безопасной питьевой воде.
    intro: |-
      Несмотря на национальные реформы, регион по-прежнему остро нуждается в углублении диалога и координации для эффективного использования водного потенциала.

      Проблемы региона выходят далеко за рамки простого дефицита воды: они затрагивают устойчивость экономики, здравоохранение, социальную стабильность и трансграничные отношения.

      Рост температуры увеличивает потребность сельскохозяйственных культур в воде, что усиливает нагрузку на водные системы и повышает риск дефицита воды.

      Эффективное управление подземными водами требует комплексного и устойчивого подхода, включающего усовершенствованный мониторинг и регулирование водопользования. Дублирование и пересечение полномочий между органами власти препятствует принятию оптимальных решений.
    charts:
      - image: /assets/images/uploads/1. ВОда.png
        caption: 'Стратегические выводы по проблемам дефицита воды в Центральной Азии. Источник: Всемирный банк, 2024 г.'
        note: ''
      - image: /assets/images/uploads/2. Вода.png
        caption: 'Издержки ограниченного регионального сотрудничества в сфере водных ресурсов. Источник: Adelphi and CAREC (2017).'
        note: ''
      - image: /assets/images/uploads/3. Вода.png
        caption: 'Площадь орошаемых земель в Центральной Азии — доля (%) каждой страны в общей площади региона (10,1 млн га). Источник: Всемирный банк, 2024 г.'
        note: ''
      - image: /assets/images/uploads/4. вода.png
        caption: 'Скоординированная и оптимизированная эксплуатация каскада водохранилищ обеспечивает водную и энергетическую безопасность как в текущих условиях, так и в условиях изменения климата. Источник: Всемирный банк, 2020 г.'
        note: ''
      - image: /assets/images/uploads/5. вода.png
        caption: 'Сточные воды в странах Центральной Азии: объёмы сбора, очистки и повторного использования. Источник: Всемирный банк, 2024 г.'
        note: ''
    scenarios:
      - title: Влияние изменения климата
        description: 'Односторонние действия по развитию стран, расположенных в верховьях рек, в сочетании с недостатком регионального сотрудничества создают серьёзные риски для Центральной Азии. Первый риск связан с односторонними проектами, реализуемыми в Афганистане. Так, после завершения строительства канала Кош-Тепа ожидается, что из Амударьи будет ежегодно отбираться 10–16 млрд м³ воды, что серьёзно повлияет на водообеспечение сельского хозяйства в Узбекистане и Туркменистане, а также на выработку гидроэлектроэнергии на Туямуюнском гидроузле (ТГУ), расположенном на этой же границе. Ожидается, что приток воды к ТГУ сократится на 25%, водоснабжение сельского хозяйства уменьшится примерно на 6%, а выработка гидроэнергии — примерно на 22% в год. Это показывает, насколько энергетический сектор зависит от изъятия воды в верховьях реки.'
        outcome: Совокупность рисков связана с недостатком сотрудничества в регионе — с дефицитом доверия между государствами, недостаточным потенциалом региональных институтов и отсутствием возможности эффективно координировать совместное использование водных ресурсов.
      - title: Глобальная и региональная неопределённость в энергетике, экономике, демографии и геополитике
        description: |-
          Устойчивое управление водными ресурсами усложняется под влиянием различных внешних факторов. Изменение цен на энергоресурсы и геополитические сдвиги могут резко увеличить расходы на подачу воды насосными станциями, что повышает нагрузку на экономику водоснабжения, государственный бюджет и конечных потребителей.

          Потери в сельском хозяйстве могут подтолкнуть страны к переходу на стратегию продовольственного самообеспечения, что увеличит спрос на воду и усилит конкуренцию между гидроэнергетикой и орошением.

          Демографические факторы также усиливают неопределённость: рост численности населения, миграция (в том числе из соседних стран), уровень рождаемости, благосостояние и образование напрямую влияют на водопотребление.
        outcome: Массовая миграция может привести к неожиданному росту спроса на воду и электроэнергию, создавая дополнительные трудности для планирования и управления ресурсами.
    recommendations:
      - text: |-
          Для решения выявленных проблем и создания условий для устойчивого развития региона государства сосредоточились на четырёх ключевых направлениях:
          повышение эффективности водопользования;
          внедрение новых финансовых инструментов;
          цифровизация водного сектора;
          модернизация и восстановление существующей водной инфраструктуры.
      - text: |-
          Государства могут пересмотреть правила эксплуатации водной инфраструктуры, чтобы находить компромиссные решения и обеспечивать эффективное управление в условиях изменения климата и сокращения ледниковых запасов. Существующие подходы включают:
          совместные инвестиции стран, расположенных в верховьях и низовьях рек, в водохранилища, создание совместной инфраструктуры и разработку согласованных правил эксплуатации;
          охрану и управление подземными водами для частичной компенсации потерь снежных и ледниковых запасов в летний и зимний сезоны.
      - text: Дальнейшее развитие стран Центральной Азии зависит от максимально эффективного использования имеющихся водных и энергетических ресурсов в условиях изменения климата, роста населения и увеличения потребностей. В советский период (1960–1980-е годы) была создана единая водно-энергетическая система и взаимосвязанная инфраструктура, которая легла в основу сотрудничества и согласованных обязательств между странами региона. После распада Советского Союза государства сформировали новые водно-энергетические отношения, учитывающие принципы государственного суверенитета и рыночной экономики.
      - text: 'Многие водные объекты Центральной Азии — водохранилища, гидроэлектростанции, каналы и водозаборные сооружения — расположены на границе двух государств и эксплуатируются или обслуживаются совместно. Для эффективного управления ими страны заключают двусторонние соглашения, обеспечивающие совместную эксплуатацию, ремонт и финансирование. Ключевые составляющие успешного сотрудничества — усовершенствованный мониторинг, учёт водных ресурсов и прозрачный обмен данными. Цифровые технологии и дистанционное зондирование могут дополнить традиционные измерения, повышая полноту и достоверность данных.'
      - text: Эффективное управление водными ресурсами требует пересмотра норм орошения, оптимального распределения воды между сельскохозяйственными культурами и пересмотра схем посева с учётом местных гидроклиматических условий и рыночных возможностей. Это способствует не только снижению дефицита воды, но и стимулированию водосбережения, а также повышению эффективности сельского хозяйства. Дополнительные инвестиции, направленные на повышение эффективности орошения, имеют важное значение для обеспечения продовольственной безопасности и устойчивого экономического роста.
      - text: Чтобы увеличить инвестиции в водные объекты и повысить качество обслуживания, страны ищут механизмы привлечения частного сектора. Среди уже применяемых подходов — передача насосных станций инвесторам для модернизации и эксплуатации, а также управление внутрихозяйственными ирригационными системами на уровне кластеров водопользователей в сельском хозяйстве.
      - text: Для снижения спроса на воду и сокращения дефицита воды в регионе необходимы инвестиции в модернизацию ирригационной инфраструктуры и внедрение передовых технологий, таких как капельное и дождевальное орошение. В сочетании с учётом водопользования и введением лимитов на потребление воды эти меры позволят повысить рациональность водопользования и сократить потери.
      - text: |-
          Существующая инфраструктура водохранилищ обладает значительным потенциалом для повышения эффективности за счёт гибких стратегий управления и подходов, основанных на данных. Так, исследования показывают, что интеграция сезонных гидрометеорологических прогнозов в оперативное принятие решений на Нурекском водохранилище может увеличить годовую выработку
          гидроэлектроэнергии на 13–14%, а также способствовать снижению риска паводков и наводнений. Этот пример демонстрирует, что использование прозрачных, основанных на данных подходов позволяет одновременно достигать нескольких целей: оптимизировать энергоснабжение, управлять водными рисками и справедливо распределять воду между конкурирующими секторами.
  - slug: energy
    title: Энергетика
    subtitle: Среди энергетических ресурсов Центральной Азии особое стратегическое значение имеют природный газ и электроэнергия.
    stats:
      - value: 80% / 50%
        label: 'Такую долю занимает Туркменистан в подтверждённых запасах газа региона (свыше 80%) и в объёме его добычи (50%).'
      - value: 155 млрд м³
        label: Составила совокупная добыча газа в пяти республиках Центральной Азии в 2022 году — это почти в четыре раза больше, чем в Европейском союзе, и сопоставимо с показателями Австралии, седьмого по величине производителя газа в мире.
      - value: '«Центральная Азия — Китай»'
        label: 'Газопровод «Центральная Азия — Китай»: по трём его ниткам поставляется основная часть экспорта в Китай.'
      - value: 2,8 млрд м³
        label: Столько газа в год Узбекистан начал импортировать из России с 2023 года.
      - value: Азербайджан
        label: С 2022 года Туркменистан в рамках трёхстороннего соглашения также начал поставлять небольшие объёмы газа этой стране через территорию Ирана.
    intro: |-
      Региональная интеграция энергетики и транспорта способна принести значительные экономические выгоды — прежде всего за счёт снижения потребности в инвестициях в производство энергии и сокращения топливных издержек.

      Несмотря на возрождающийся интерес к региональному сотрудничеству, потенциал взаимосвязанности и торговли энергоресурсами до сих пор реализован не полностью. К основным препятствиям относятся отсутствие эффективной региональной торговой платформы, устаревшая инфраструктура и институциональная раздробленность. Усиление сотрудничества в сфере электроэнергии, газа и других энергоресурсов способствует повышению энергетической безопасности, прозрачности и устойчивости региона — а это необходимое условие для обеспечения экономического благополучия региона с быстро растущим населением.

      С 2018 года избыточные объёмы газа в регионе сокращаются, поскольку добыча заметно замедлилась, а внутреннее потребление растёт быстрыми темпами. Узбекистан и Казахстан как основные экспортёры региона в последние годы стремятся поддерживать положительный торговый баланс, однако, по предварительным данным, с 2023 года Узбекистан впервые с момента обретения независимости стал чистым импортёром газа. В Туркменистане — особенно в связи с освоением второй очереди месторождения Галкыныш — сохраняется значительный неиспользованный экспортный потенциал, однако судьба проекта поставок по линии D мощностью 30 млрд м³ в год пока остаётся неясной.
    charts:
      - image: /assets/images/uploads/1. Энергетика.png
        caption: 'Сточные воды в странах Центральной Азии: объёмы сбора, очистки и повторного использования. Источник: Всемирный банк, 2024 г. Примечание: объём добычи газа показан серым, его потребление — жёлтым; красная линия обозначает уровень экспорта газа.'
        note: ''
      - image: /assets/images/uploads/2. энергетика.png
        caption: 'Внутрирегиональная и внешняя торговля газом в Центральной Азии, 2022 год. Источник: Statistical Review of World Energy 2024, Energy Institute; Международное энергетическое агентство.'
        note: ''
      - image: /assets/images/uploads/3. энеретика.png
        caption: Производство энергии по странам, 2025 год, ПДж.
        note: ''
      - image: /assets/images/uploads/4. Энергетика.png
        caption: 'Путь низкоуглеродной политики в Центральной Азии: ключевые этапы и возможности. На заднем плане — суммарные выбросы по секторам (МтCO2-экв.). Источник: модель энергетической системы Всемирного банка. Примечание: диаграмма фокусируется на основных секторах-потребителях энергии и не охватывает выбросы от добычи полезных ископаемых, сельского хозяйства, производства водорода и вспомогательных работ в энергетическом секторе (работы, выполняемые на месте).'
        note: ''
    scenarios:
      - title: Финансовые и рыночные ограничения
        description: |-
          Слабые финансовые показатели энергетического сектора замедляют внедрение возобновляемых источников энергии (ВИЭ) и других технологий.
          Сектор находится в переходном периоде: рыночные реформы продолжаются, однако заниженные ценовые сигналы ограничивают инвестиции.
        outcome: Частные инвесторы сталкиваются с регуляторной и рыночной неопределённостью, а также с нехваткой данных, что замедляет внедрение технологий и передачу знаний.
      - title: Риск дефицита энергии
        description: Недостаточные инвестиции в инфраструктуру, изменение климата (сезонные засухи) и отсутствие региональной координации могут усугубить дефицит газа и электроэнергии зимой в Таджикистане, Кыргызстане и Узбекистане.
        outcome: Ситуация может улучшиться лишь к началу 2030-х годов, когда в Таджикистане и Кыргызстане будут введены в строй новые гидроэнергетические мощности, а в Узбекистане получит широкое развитие солнечная и ветровая генерация.
      - title: Загрязнение воздуха
        description: |-
          Качество воздуха особенно низкое в городах: концентрация PM2.5 там нередко в 6–12 раз превышает норму, рекомендованную ВОЗ (5 мкг/м³).
          В крупных городах (Бишкек, Душанбе, Ташкент, Алматы) уровень PM2.5 вдвое превышает промежуточный целевой показатель ВОЗ (35 мкг/м³).
          В сельской местности уровень загрязнения ниже из-за меньшей плотности населения, однако продолжающаяся урбанизация усугубляет проблему.
        outcome: 'Электромобили и тепловые насосы получат массовое распространение: к 2050 году их число может достичь 20 миллионов, а доля домохозяйств, использующих тепловые насосы, превысит 50%.'
    recommendations:
      - text: |-
          Снижение издержек и увеличение экономической выгоды:
          государства могут снижать издержки производства электроэнергии, импортировать недорогую электроэнергию в периоды пикового спроса и экспортировать излишки выработки в периоды низкого спроса, тем самым эффективно используя временные и сезонные различия в потреблении.
          Ожидается, что в 2020–2030 годах региональная торговля электроэнергией и газом принесёт экономическую выгоду в размере до 6,4 млрд долларов США.
      - text: |-
          Повышение энергетической безопасности:
          взаимосвязанные сети обеспечивают диверсификацию источников поставок и снижение зависимости от одного вида топлива или внутреннего производства, тем самым укрепляя устойчивость региональных энергетических систем.
      - text: |-
          Интеграция возобновляемых источников энергии:
          региональная торговля облегчает интеграцию переменных возобновляемых источников — в частности, солнечной энергетики в Узбекистане и ветровой энергетики в Казахстане, — балансируя производство и спрос за счёт трансграничных перетоков.
      - text: |-
          Сокращение загрязнения и выбросов парниковых газов:
          замещение загрязняющих видов топлива импортом чистой гидро- и возобновляемой энергии или газа в широких масштабах снижает загрязнение воздуха и выбросы парниковых газов.
      - text: |-
          Оптимизация эффективного использования инфраструктуры:
          трансграничная торговля позволяет максимально использовать существующие и новые энергетические активы, снижая потребность в дополнительных внутренних инвестициях.
      - text: |-
          Институционализация сотрудничества через создание Энергетического совета государств Центральной Азии.
          Для обеспечения региональной энергетической безопасности механизм консультативных встреч министров энергетики необходимо преобразовать в постоянно действующий Энергетический совет.
          Это позволит перейти от консультаций к практическому и системному сотрудничеству, сформировать единый подход к управлению региональными энергетическими ресурсами и создать институциональную основу для принятия долгосрочных и обязательных решений.
      - text: Разработка и внедрение долгосрочных национальных стратегий, охватывающих энергетическую политику, механизмы финансирования и стимулирования.
      - text: Формирование и развитие конкурентных рынков электроэнергии.
  - slug: transport
    title: Транспорт
    subtitle: Центральная Азия занимает уникальное геостратегическое положение. Когда-то эту роль выполнял Великий шёлковый путь, связывавший Европу с Китаем и Индией.
    stats:
      - value: 10 млн тонн
        label: Прогнозируемый объём грузоперевозок по Среднему коридору к 2030 году.
      - value: 900 км
        label: 'На столько сокращает маршрут между Восточной Азией и Европой железная дорога «Китай — Кыргызстан — Узбекистан».'
      - value: 500 тыс. TEU
        label: 'Мощность сухого порта «Хоргос» в Казахстане в год.'
      - value: 30%
        label: Автомобильных дорог в Кыргызстане и Таджикистане непригодны для круглогодичной эксплуатации.
      - value: 4х
        label: Во столько раз может вырасти объём транзитных перевозок через Центральную Азию к 2050 году.
    intro: |-
      Сегодня транспортные маршруты стран Центральной Азии восстанавливаются и модернизируются с учётом современных экономических, технологических и логистических стандартов.

      Поскольку регион не имеет выхода к морю, транспортная и логистическая связанность должна стать одним из главных направлений развития. Возможно, настало время разработать единую региональную транспортную стратегию, объединяющую существующие коридоры, экспортные маршруты и внутренние направления. По сути, речь идёт о центральных узлах евразийского континента. При этом нынешнее место региона в мировой торговле значительно уступает его потенциалу: несмотря на то что годовой товарооборот между Европой и Восточной Азией превышает 1,5 трлн долларов США, доля Центральной Азии в нём по-прежнему составляет менее 3%.

      Разрыв между потенциалом региона и его фактическим положением объясняется рядом факторов: недостаточным развитием инфраструктуры, институциональными барьерами и отсутствием координации между странами региона. Тем не менее именно в этом разрыве заключён огромный потенциал.
    charts: []
    scenarios:
      - title: Развитие транспортной системы Центральной Азии связано с геополитическими, институциональными и финансовыми рисками
        description: Существующие транспортные маршруты — в том числе северный маршрут через Казахстан и Россию, а также центральный коридор через Кавказ или Китай — демонстрируют высокую зависимость от внешних факторов. Геополитическая нестабильность, санкционные ограничения, узкие места в инфраструктуре и различия в технических стандартах создают риск нарушения цепочек поставок и роста логистических издержек.
        outcome: ''
      - title: Финансовые потребности региона очень велики
        description: |-
          По оценке Азиатского банка развития, модернизация транспортных систем потребует
          примерно 500 млрд долларов США до 2030 года. При этом в рамках CAREC уже реализовано 22 транспортных проекта (на сумму 6,1 млрд долларов США в 2001–2024 годах), Китай инвестировал более 20 млрд долларов США в рамках инициативы «Один пояс — один путь», а ЕС в рамках программы Global Gateway объявил о планах вложить до 10 млрд евро в развитие Транскаспийского маршрута.
        outcome: 'Этот перспективный коридор включает два основных железнодорожных направления: маршрут I — Термез — Мазари-Шариф — Герат до портов Бендер-Аббас и Чабахар; маршрут II — Термез — Найбобод — Майданшахр — Логар — Харлачи, которые пока находятся на стадии разработки и согласования. Предварительная стоимость Трансафганской железной дороги (647 км) до портов Пакистана оценивается в 4,6 млрд долларов США. Ожидаемый грузопоток по этим двум коридорам составит около 10 млн тонн в год, а в течение следующего десятилетия может вырасти до 40 млн тонн. По предварительным оценкам, срок доставки грузов через этот коридор сократится с 35 до 3–5 дней, а расходы на контейнерные перевозки снизятся почти вдвое.'
      - title: 'В отдельных странах региона (например, в Кыргызстане и Таджикистане) основная часть внешнего финансирования поступает от одного партнёра'
        description: Такая высокая концентрация ресурсов позволяет реализовывать крупные инфраструктурные проекты, однако наглядно демонстрирует важность диверсификации источников финансирования и расширения инструментов государственно-частного партнёрства (ГЧП) для повышения устойчивости.
        outcome: ''
      - title: Институциональное развитие
        description: По данным Всемирного банка и региональной аналитики, в 2023 году (по последнему доступному отчёту) страны Центральной Азии существенно различаются по Индексу эффективности логистики (Logistics Performance Index, LPI). Наилучший результат у Казахстана: 79-е место среди 139 стран с показателем 2,7 балла — лучший в регионе. Узбекистан занимает 88-е место с результатом 2,6 балла, что отражает умеренный рост в последние годы. Таджикистан находится на 97-м месте (около 2,5 балла), оставаясь в нижней части рейтинга, а Кыргызстан — с показателем около 2,3 балла и 123-м местом — демонстрирует самую низкую логистическую эффективность среди стран Центральной Азии.
        outcome: ''
      - title: Экологическая модернизация
        description: |-
          В настоящее время автомобильный транспорт обеспечивает около 70% грузооборота региона, что свидетельствует о высокой зависимости от этого вида перевозок. Вместе с тем это открывает
          значительные перспективы для перехода на железнодорожные и мультимодальные решения, что полностью соответствует глобальной повестке «зелёной логистики».
        outcome: ''
      - title: Социальная связанность
        description: |-
          Развитие магистральных транспортных коридоров идёт быстрыми темпами, закладывая прочную основу для будущего роста. Вместе с тем это подчёркивает важность расширения
          региональной и местной инфраструктуры, поскольку это позволяет вовлечь сельские и горные районы в общую транспортную систему и обеспечить более широкому кругу людей возможность выиграть от транзита.
        outcome: Если развитие транспортных систем будет осуществляться при скоординированных усилиях стран региона, Центральная Азия может стать одним из ключевых транзитных узлов Евразии. По прогнозам, при успешной реализации проектов к 2050 году объём транзитных перевозок может вырасти в 3–4 раза, доля региона в евразийском транзите — увеличиться с 3% до 8–10%, а годовой доход от перевозок — достичь 25–30 млрд долларов США. При этом увеличение доли железнодорожного транспорта до 55–60% позволит сократить углеродный след на 35–40%, а доля транспортно-логистического сектора в ВВП стран региона может составлять 1,5–2% ежегодно.
    recommendations:
      - text: |-
          Отдельного внимания заслуживает увеличение доли железнодорожных перевозок с нынешних 30% до 45–50% к 2035 году, для чего потребуется масштабная электрификация железных дорог, закупка современного подвижного состава и ускоренное
          развитие контейнерных сервисов. Создание мультимодальных хабов и сухих портов — таких как Хоргос, Актау, Ташкент, Худжанд — должно осуществляться в тесной координации с национальными и региональными транспортными сетями, что позволит сформировать единую систему распределения грузопотоков и снизить нагрузку на отдельные участки. Важными направлениями остаются строительство и реконструкция международных автомобильных дорог, улучшение подъездных путей к логистическим центрам и увеличение протяжённости электрифицированных железных дорог.
      - text: |-
          Даже при наличии современной инфраструктуры транзитный потенциал региона может остаться нереализованным без институциональных реформ. Переход на международные цифровые стандарты, такие как e-TIR и e-CMR,
          а также внедрение электронного обмена данными с соседними странами (Казахстаном, Кыргызстаном, Таджикистаном и Афганистаном) снизит транзакционные издержки, ускорит оформление грузов и уменьшит риски коррупции. Ещё одним важным направлением остаётся развитие инфраструктуры пограничных пунктов: строительство дополнительных логистических центров и их оснащение современным оборудованием для контроля и досмотра грузов.
      - text: 'Для обеспечения долгосрочной устойчивости необходимо диверсифицировать источники финансирования, объединяя ресурсы Европейского союза, АБР, Всемирного банка, ЕБРР и национальных фондов. Особое значение имеет развитие механизмов государственно-частного партнёрства: его доля в транспортных проектах должна достичь 20–25% к 2030 году. Важным условием при этом является повышение прозрачности управления внешним долгом и систематическая оценка эффективности проектов с учётом их социально-экономического воздействия.'
      - text: Разрозненные действия отдельных государств не позволяют раскрыть весь потенциал региона — для этого необходимы скоординированные меры на региональном уровне. Отсутствие общих стратегий приводит к дублированию проектов и снижает конкурентоспособность Центральной Азии как единого транзитного пространства. Важным шагом в этом направлении может стать создание механизма региональной координации, обеспечивающего стандартизацию технических параметров, тарифов и правил доступа к инфраструктуре, а также совместное финансирование.
      - text: Для успешной реализации транспортно-логистических проектов в регионе необходимо создать Совет по инфраструктурному развитию, предложенный Президентом Узбекистана, а также специальный Фонд для финансирования приоритетных региональных проектов. Такой системный подход позволит синхронизировать стратегии и обеспечить эффективное привлечение инвестиций.
  - slug: demography
    title: Социальное развитие и демография
    subtitle: Центральная Азия находится на важном этапе демографических изменений.
    stats:
      - value: 144 млн
        label: К 2050 году население региона превысит эту отметку.
      - value: 71 млн
        label: При этом численность трудоспособного населения (15–64 года) достигнет этой отметки.
      - value: 0–14
        label: На сегодняшний день дети этого возраста составляют почти треть населения Центральной Азии.
    intro: |-
      Использование демографического дивиденда — не автоматический процесс, а результат продуманных инвестиций и политической воли. Это требует, прежде всего, решительных инвестиций в образование, здравоохранение и расширение возможностей молодёжи и женщин. Только в этом случае возможны ускоренный экономический рост и полная реализация потенциала женщин на рынке труда.
      В долгосрочной перспективе, согласно прогнозам Департамента ООН по экономическим и социальным вопросам (ДЭСВ ООН) и Фонда ООН в области народонаселения (ЮНФПА), рост населения замедлится, а численность пожилых людей будет увеличиваться, что свидетельствует об изменении демографической структуры стран и ограниченности временного окна демографического дивиденда.

      При этом рост доли пожилых людей в общей численности населения требует дополнительных инвестиций в социальную сферу и гибкой политики, способной одновременно удовлетворять потребности молодёжи и пожилых людей.

      Полная интеграция и реализация концепции демографической устойчивости позволит эффективно управлять изменениями возрастной структуры, миграционными процессами, рождаемостью и продолжительностью жизни в регионе, обеспечивая устойчивое развитие, экономическую стабильность и социальное благополучие.

      Принимая стратегические решения уже сегодня, Центральная Азия способна превратить свой демографический импульс в основу долгосрочного благополучия, инноваций и региональной сплочённости.
    charts:
      - image: /assets/images/uploads/1. Демография.png
        caption: Текущие и прогнозируемые сценарии роста населения Центральной Азии (2000–2050 годы)
        note: ''
      - image: /assets/images/uploads/2. Демография.png
        caption: Текущие и прогнозируемые сценарии роста населения мира (2000–2050 годы).
        note: ''
      - image: /assets/images/uploads/3. Демография.png
        caption: Текущие и прогнозируемые сценарии роста населения Азии (2000–2050 годы).
        note: ''
      - image: /assets/images/uploads/4. Демография.png
        caption: Текущие и прогнозируемые сценарии роста населения Европы (2000–2050 годы).
        note: ''
      - image: /assets/images/uploads/5. Демография.png
        caption: Уровень экономической активности (2024 г.).
        note: ''
      - image: /assets/images/uploads/6. Демография.png
        caption: 'Доля молодёжи, не охваченной образованием, занятостью или профессиональной подготовкой (показатели NEET, 2024 г.).'
        note: ''
    scenarios:
      - title: Прогноз роста населения
        description: 'Демографические сценарии ДЭСВ ООН предполагают устойчивый рост населения Центральной Азии до 2050 года. Даже «низкий» сценарий для региона превышает «высокий» сценарий для мира, Азии и особенно Европы. Согласно «среднему» прогнозу роста, трудоспособное население Центральной Азии (15–64 года) увеличится с 50 до 71 миллиона человек, а его доля в общей структуре населения вырастет с нынешних 62% до 63% к 2050 году. Для сравнения, в 2023–2050 годах доля трудоспособного населения в Азии и Европе снизится соответственно с 67% до 64% и с 64% до 58%.'
        outcome: ''
      - title: Демографически устойчивое развитие
        description: Согласно прогнозу, если к 2050 году уровень экономической активности достигнет среднемирового показателя 2024 года, на рынок труда сможет выйти ещё 2,4 миллиона человек. При условии создания достойных рабочих мест это будет способствовать росту ВВП и снижению уровня бедности, а также гендерного, территориального и возрастного неравенства.
        outcome: Ключевые направления включают инвестиции в здравоохранение, образование и развитие навыков, а также в активную политику занятости, ориентированную на цифровую и «зелёную» экономику. В этом случае молодёжь региона сможет полностью реализовать свой потенциал, что обеспечит ускоренный экономический рост и достижение Целей устойчивого развития.
      - title: Инклюзивное развитие
        description: 'Без инвестиций в инклюзивный рынок труда существует риск появления «потерянного поколения», лишённого возможностей для развития.'
        outcome: ''
      - title: Гендерное равенство и расширение прав и возможностей женщин
        description: |-
          В Центральной Азии невозможно в полной мере реализовать демографический дивиденд без полноценной интеграции женщин в экономику. Разрыв в 22 процентных пункта между уровнем экономической активности женщин и мужчин (2024 г.) свидетельствует о значительных макроэкономических потерях.

          Среди ключевых барьеров можно выделить высокую рождаемость, ограниченный доступ к услугам планирования семьи, нехватку услуг по уходу за детьми, негибкие условия труда, обязанности по уходу за пожилыми родственниками, а также факторы, препятствующие образованию и карьере женщин. Всё это снижает квалификацию женщин и вовлекает их в неформальную занятость.

          В ряде стран региона были проведены реформы, в частности отменён запрет на труд женщин в тяжёлой промышленности, введены субсидии для предприятий, возглавляемых женщинами. Однако главный барьер — неоплачиваемый домашний труд — по-прежнему сохраняется, и одними правовыми мерами его не устранить.
        outcome: Целевые инвестиции в человеческий капитал женщин — развитие социальной инфраструктуры и занятости с учётом гендерных аспектов — являются ключом к полноценному использованию «гендерного дивиденда».
      - title: Активное долголетие
        description: |-
          Женщины живут дольше мужчин, однако из-за занятости в неформальном секторе и перерывов в трудовой деятельности их пенсионные накопления оказываются меньше, что ведёт к «феминизации бедности». В качестве решения можно выделить пенсионные
          реформы с учётом гендерных аспектов, расширение социальной защиты, формализацию занятости женщин и признание неоплачиваемого труда.
        outcome: Использование демографических прогнозов при планировании систем здравоохранения и социальной защиты имеет большое значение, поскольку позволяет своевременно переориентировать услуги на геронтологическое направление и обеспечить возможность занятости пожилых людей и их активного участия в общественной жизни.
      - title: Миграция и мобильность
        description: |-
          Миграция играет важную роль в развитии Центральной Азии. Исторически регион пережил масштабные миграционные потоки — от сельско-городской миграции и переселений советского периода до современной внешней и циркулярной трудовой миграции.
          Для Кыргызстана и Таджикистана трудовая миграция остаётся жизненно важной: эти страны входят в число мировых лидеров по доле денежных переводов в ВВП, значительная часть которых приходится на нынешних и бывших мигрантов.

          В Узбекистане наблюдается схожая, но несколько менее выраженная тенденция. Казахстан, напротив, становится центром притяжения мигрантов из соседних стран. Однако высокий уровень неформальной и нерегулярной занятости делает мигрантов
          одной из наиболее уязвимых социальных групп, а их дети нередко становятся «социальными сиротами», сталкиваясь с риском недостаточной заботы и маргинализации.
        outcome: ''
    recommendations:
      - text: |-
          Увеличение инвестиций в человеческий капитал женщин.

          Наращивание государственного и регионального финансирования здравоохранения, образования и развития навыков. При этом приоритетное внимание следует уделять обеспечению равных возможностей для женщин и молодёжи с ограниченными возможностями, особенно проживающих в сельской местности. Важно также предусмотреть меры поддержки для девочек, детей с инвалидностью и молодых женщин, не охваченных ни образованием, ни занятостью. Учёт гендерных аспектов при формировании бюджетов и проведении реформ позволит повысить эффективность инвестиций и сократить неравенство.

          Интеграция семейной и репродуктивной политики в стратегии развития рынка труда. Обеспечение широкого и удобного доступа к услугам репродуктивного здоровья, введение оплачиваемого отпуска по уходу за ребёнком, гибкого графика работы и доступного по цене дошкольного образования как мер поддержки семей. Эти инициативы одновременно укрепляют занятость женщин, стабильность рождаемости, производительность труда и благополучие населения.
      - text: |-
          Экономическая интеграция и расширение возможностей молодёжи.

          Разработка стратегий занятости молодёжи с учётом демографических тенденций. Важное значение имеют программы развития цифровых, «зелёных» и социальных навыков, а также меры по расширению доступа молодёжи к рынку труда, микрофинансированию, менторским программам и стартапам, включая трансграничные инновационные кластеры.
          Создание региональных стипендиальных программ и программ академической мобильности. Межгосударственные фонды и программы обмена дают молодёжи, включая представителей сельских и нуждающихся сообществ, возможность обучаться в ведущих вузах региона,
          одновременно укрепляя региональную идентичность и формируя сеть будущих лидеров.

          Укрепление трансграничного сотрудничества в сфере молодёжной политики и безопасности. Программы профилактики экстремизма, гражданского участия, медиаграмотности и развития критического мышления необходимо развивать в первую очередь в приграничных районах со смешанным национальным составом. Это укрепляет устойчивость молодёжи и её роль
          в построении безопасного и инклюзивного региона.
      - text: |-
          Расширение участия на рынке труда и создание достойных рабочих мест.

          Внедрение региональных механизмов признания квалификаций и единых образовательных стандартов. Это упростит трансграничное трудоустройство и сократит масштабы неформальной миграции.
          Создание рабочих мест в «зелёной» экономике и сфере ухода. Инвестиции в возобновляемую энергетику, устойчивое сельское хозяйство, переработку отходов, а также уход за пожилыми людьми и детьми снижают безработицу и способствуют достижению целей устойчивого развития.

          Устранение барьеров для экономической активности женщин. Требуются реформы, упрощающие регистрацию бизнеса, расширяющие занятость женщин и стимулирующие работодателей обеспечивать доступ к услугам по уходу за детьми и пожилыми людьми.
      - text: |-
          Подготовка к старению населения.

          Модернизация пенсионных систем и систем долгосрочного ухода. Это необходимо для обеспечения финансовой устойчивости, справедливости и беспрепятственного доступа к услугам для всех, особенно для женщин и работников неформального сектора.

          Продвижение активного долголетия. Переобучение, наставничество, цифровое образование и обмен волонтёрским опытом дают пожилым людям возможность вносить вклад в развитие экономики и общества.

          Расширение регионального диалога по вопросам старения. Совместное демографическое прогнозирование, обмен статистикой и экспертными консультациями помогает адаптировать социальные и экономические системы к новым условиям.
      - text: |-
          Безопасная и эффективная миграция.

          Координация миграционной политики и защиты прав мигрантов. Особое значение имеют взаимное признание квалификаций, стандартизированные трудовые договоры и механизмы правовой защиты — прежде всего для женщин и молодёжи.
          Продвижение принципа экстерриториальности социальных пособий и услуг. Двусторонние и региональные соглашения должны гарантировать мигрантам и их семьям сохранение накопленных пенсионных прав, а также доступ к здравоохранению и образованию.

          Упрощение мобильности за счёт цифровых удостоверений личности и современной инфраструктуры. Такие инструменты повышают прозрачность и упрощают перемещение для молодёжи, студентов и специалистов.
      - text: |-
          Демография и климатическая устойчивость.

          Интеграция демографических факторов в климатические стратегии.

          Это касается прежде всего градостроительства, водоснабжения и продовольственной безопасности.
          Укрепление регионального сотрудничества в управлении природными ресурсами. Особенно важно сотрудничество в бассейне Аральского моря — по вопросам воды, земли и экосистем.

          Развитие систем раннего оповещения с учётом гендерных и возрастных особенностей. Женщины и молодёжь должны находиться в центре демографической
          адаптации.
      - text: |-
          Применение демографического анализа в планировании.

          Развитие регулярной переписи населения и прогнозирования. Это позволяет своевременно учитывать важные изменения и корректировать стратегии.

          Гармонизация статистических показателей. Согласованные методологии облегчают трансграничный анализ и совместное планирование.

          Создание региональных демографических центров. Они координируют анализ данных, проведение исследований и подготовку научно обоснованных рекомендаций для устойчивого развития.
