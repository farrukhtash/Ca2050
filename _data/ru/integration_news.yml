  - image: /assets/images/uploads/photo_2026-09-11_16-29-25.jpg
    title: Состоится первый в истории саммит "Корея–Центральная Азия"
    description: |-
      14 сентября Шавкат Мирзиёев встретится в Сеуле с президентом Южной Кореи Ли Чжэ Мёном.

      А 16 сентября пройдёт первый в истории саммит "Корея–Центральная Азия", в котором примут участие главы пяти государств.

      Среди обсуждаемых тем — важнейшие минералы, энергетика, искусственный интеллект и деловое сотрудничество.
