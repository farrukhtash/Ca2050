leaders:
  - photo: /assets/images/uploads/kz1-3324-2_mediumThumb.jpg
    flag: /assets/images/uploads/images (1).jpg
    quote: "«Геополитическая неопределённость и разрушение прежней модели мироустройства — это, по сути, единственно прагматичный взгляд на вещи. Наше будущее зависит от укрепления солидарности, взаимного доверия и открытости миру. Только на основе этих принципов мы сможем обеспечить ренессанс Центральной Азии как динамичного, инновационного и культурно богатого региона.»"
    name: Касым-Жомарт Токаев
    position: Президент Республики Казахстан
    country: Казахстан
    order: 2
  - photo: /assets/images/uploads/DOS_5161.jpg
    flag: /assets/images/uploads/new-flag-kyrgyzstan-kyrgyz-original-260nw-2409846521.jpg
    quote: "«...страны Центральной Азии должны начать процесс введения безвизового режима между собой, а для гостей из других государств — единой визы по типу шенгенской, позволяющей свободно передвигаться по всем странам региона.»"
    name: Садыр Жапаров
    position: Президент Кыргызской Республики
    country: Кыргызстан
    order: 3
  - photo: /assets/images/uploads/55512943786_a2546a7a88_b.jpg
    flag: /assets/images/uploads/images (3).jpg
    quote: "«В нынешних условиях стремительно меняющегося мира возникла необходимость сформировать общее видение будущего Центральной Азии.»"
    name: Эмомали Рахмон
    position: Президент Республики Таджикистан
    country: Таджикистан
    order: 4
  - photo: /assets/images/uploads/20-09 001.jpg
    flag: /assets/images/uploads/images (2).jpg
    quote: "«Сохраняя свою самобытность, независимость и право выбора собственной модели внутреннего и внешнего развития, мы едины в стремлении превратить наш регион в процветающую, высокоразвитую территорию, глубоко интегрированную в современные глобальные связи. Убеждён, что только в таких условиях наши государства и народы смогут обеспечить себе достойное и надёжное будущее.»"
    name: Сердар Бердымухамедов
    position: Президент Туркменистана
    country: Туркменистан
    order: 5
  - photo: /assets/images/uploads/14515701-a26b-2a2d-0285-bf8c09aa365a.jpg
    flag: /assets/images/uploads/images.jpg
    quote: "«В нынешний исключительно сложный период Узбекистан и регион Центральной Азии предлагают международному сообществу бесценный ресурс — стабильность, доверие и развитие.»"
    name: Шавкат Мирзиёев
    position: Президент Республики Узбекистан
    country: Узбекистан
    order: 1
