tab_title: Говорит следующее поколение
hero_eyebrow: Сборник эссе
hero_title: Когда говорит новое поколение...
hero_subtitle: |-
  Особое внимание в осмыслении будущего Центральной Азии было уделено голосу представителей самого региона. Всем желающим из разных стран региона предложили описать в форме эссе, каким они видят будущее своей страны к 2050 году. Эти эссе легли в основу одной из ключевых глав книги — «Когда говорит новое поколение…», где обсуждаются вопросы идентичности, гендерного равенства, экологии, технологий и ценностей будущего.

  Это взгляд нового поколения на то, каково жить в этом будущем.
intro_text: |-
  Центральная Азия издавна воспринималась как перекрёсток цивилизаций и источник ярких художественных образов. Через её бескрайние степи проходили длинные караваны, перевозившие товары и идеи из одного края в другой; здесь жили гордые и воинственные народы, у которых порой сохранялся обычай похищения невест. Земля высоких минаретов и заснеженных гор, бесчисленных юрт и табунов лошадей, она стала частью декораций древней политической истории. Центральной Азии редко предоставлялась возможность в полной мере заявить о себе: чаще извне она воспринималась либо как источник поэтических образов, либо как второстепенный фон в расчётах крупных игроков континента, либо как отдалённая периферия. Собственная идентичность региона долгое время оставалась подвешенной между его славным прошлым и туманным будущим, во многом формируемым чужим воображением.

  Эссе, вошедшие в этот сборник, предлагают иной взгляд на ситуацию. Вместе они образуют хор разных голосов, каждый из которых высказывает собственное представление о будущем региона. И каждый из них рассказывает историю, неразрывно связанную с жизнью и чаяниями миллионов людей, считающих Центральную Азию своим домом.

  Картины будущего, представленные в эссе, отнюдь не отрицают сохраняющихся сложных и трудных реалий региона. Однако вместо традиционного обращения к прошлому эти истории проникнуты духом надежды и устремлённости вперёд, опирающимся на память и нравственные ориентиры авторов.

  Первая из этих составляющих позволяет авторам опираться на опыт и традиции Центральной Азии. По их мнению, именно эти традиции способны лучше всего подготовить регион к предстоящим десятилетиям.

  Вторая же побуждает читателя задуматься над ключевым вопросом: «Каким обществом мы могли бы стать, если бы отодвинули в сторону наши различия и противоречия и вместо этого сосредоточились на том, что нас объединяет?»

  Это непростой вопрос, и авторы сборника — исследователи, практики и наблюдатели — предлагают на него убедительные ответы.

  Не все авторы настроены оптимистично. Некоторые из них указывают на ущерб, накопившийся за годы близоруких, ориентированных на краткосрочную перспективу решений, экологической беспечности и бюрократической неразберихи. Будущее, изображённое в их текстах, — это не утопия и не антиутопия, а противоречивая и изменчивая реальность.

  Это предостережение от тех, кому небезразличны проблемы региона и его будущее. Обращая внимание на эти проблемы, они надеются побудить общество сосредоточиться на мерах, способных не допустить движения по ошибочному и нежелательному пути развития.

  Времени остаётся немного, и перемены должны начаться уже сегодня.
