concepts:
  - title: Хашар (ашар, асар)
    description: |-
      Хашар — традиционная форма добровольного коллективного труда, широко распространённая в Узбекистане и других странах Центральной Азии и основанная на взаимопомощи и солидарности. Соседи сообща расчищают арыки, чинят крыши или убирают урожай до наступления холодов. Автор эссе отмечает, что именно
      благодаря этой традиции в регионе уже существует готовый механизм взаимопомощи и совместного управления общими ресурсами — будь то вопросы водопользования сегодня или управление информационными сетями завтра.
