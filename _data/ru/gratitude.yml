title: Организации, принявшие участие в подготовке книги
text: |-
  Мы выражаем глубокую признательность делегациям Европейского союза в Узбекистане и Казахстане за последовательную и искреннюю поддержку данной инициативы. В частности, два представительства ЕС профинансировали визиты экспертов из других стран Центральной Азии, создав важные условия для диалога и обмена опытом. Особенно мы благодарим Посла Европейского союза в Узбекистане Тойво Клаара и менеджера программ Делегации ЕС в Узбекистане Яну Купришу — их личное внимание, доверие и практическая помощь внесли значительный вклад в успех этого процесса.

  Также выражаем отдельную благодарность программе Всемирного банка Central Asia Water and Energy Program (CAWEP), реализуемой в партнёрстве с правительствами Европейского союза, Швейцарии и Великобритании, за экспертную поддержку высокого уровня и конструктивное сотрудничество в области эффективного использования водных ресурсов, изменения климата и энергетики. Главы 4, 5 и 6 книги были сформированы на основе материалов и аналитических разработок программы и существенно обогащены благодаря её вкладу.

  Искреннюю признательность мы выражаем Фонду ООН в области народонаселения (ЮНФПА) за стратегическое партнёрство, а также за весомый вклад в глубокое и всестороннее освещение тем человеческого развития и социальных процессов. В частности, главы 2 и 8 книги, а также справочное приложение по демографии пяти республик Центральной Азии стали результатом этого сотрудничества. Благодаря поддержке Фонда в издании отражены научно обоснованные прогнозы демографических изменений в регионе, а также сформирован обобщённый и целостный демографический портрет населения Центральной Азии. В связи с этим мы выражаем особую благодарность руководителю представительства ЮНФПА доктору Нигине Аббасзода, команде странового офиса ЮНФПА в Узбекистане, а также команде регионального офиса ЮНФПА за неизменную поддержку и эффективное сотрудничество в реализации данной инициативы.

  Глава 9 — сборник эссе, в которых звучит голос жителей региона, — приобрела высокий уровень благодаря труду редакторов, и в связи с этим мы выражаем особую благодарность редакционной команде. Дина Игликова, основательница регионального сообщества Mampassi Collective of Central Asia, и доктор Сийнат Султоналиева, резидент сообщества и исследователь Центральной Азии, в течение месяца внимательно изучили более ста эссе, поступивших из стран региона, и отобрали наиболее достойные из них. Их вдумчивые аналитические комментарии стали неотъемлемой частью общей дискуссии и придали содержанию книги личный характер и эмоциональную глубину. Мы выражаем искреннюю признательность за их неизменную поддержку, внимание к деталям и неоценимый вклад в формирование содержательного раздела, отражающего голос жителей региона.

  Также выражаем отдельную благодарность редакции Gazeta.uz за публикацию материалов и широкое освещение конкурса эссе. Именно благодаря их медийной поддержке удалось расширить аудиторию и привлечь более широкий круг участников.
  Эта книга увидела свет благодаря поддержке, доверию и совместным усилиям множества людей и организаций. Каждый вклад — будь то интеллектуальный, институциональный, экспертный или человеческий — был значимым и незаменимым.
