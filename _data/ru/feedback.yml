hero_eyebrow: Контакты
hero_title: Оставьте свой отзыв
hero_sub: Вы уже прочитали книгу? Поделитесь своими мыслями о ней, её выводах и будущем региона — каждый отзыв важен для нас.
intro_paragraphs:
  - text: «Государства Центральной Азии 2050» — это начало открытого разговора о будущем региона, а не его завершение. Нам важно знать, какие мысли и вопросы возникли у вас после прочтения книги — это помогает нам улучшать исследование и последующие издания.
  - text: С помощью короткого опроса ниже вы можете рассказать, какие разделы книги оказались для вас наиболее полезными, чего, по вашему мнению, не хватает, и какие темы, связанные с будущим региона, стоит раскрыть глубже. Это займёт всего несколько минут.
