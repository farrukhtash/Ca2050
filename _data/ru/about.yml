intro:
  - "Эта книга — итог первого регионального форсайт-диалога в истории независимой Центральной Азии. Представители ведущих аналитических центров пяти стран и независимые эксперты впервые собрались за одним столом, чтобы проанализировать ключевые вызовы и возможности региона и предложить видение его будущего до 2050 года."
  - "Книга построена вокруг четырёх приоритетных направлений — водные ресурсы и изменение климата, энергетика, транспортные связи и демография — а также включает отдельную главу, посвящённую голосу молодёжи региона."
