# Sveltia CMS configuration — CA2050 (Jekyll + jekyll-polyglot)
# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Аутентификация: один пользователь через Personal Access Token (PAT).
# На экране входа — «Sign in with Token», fine-grained PAT с правом
# Contents: Read and write к farrukhtash/Ca2050. Без Cloudflare Worker.

backend:
  name: github
  repo: farrukhtash/Ca2050
  branch: main

site_url: https://ca2050.uz
display_url: https://ca2050.uz

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

# ── Нативная i18n Sveltia ──────────────────────────────────────
# Каждая локаль хранится в своей папке: _data/<locale>/<name>.yml.
# В редакторе языки переключаются вкладками. Дефолт (uz) — в _data/uz/.
# Добавление локали: добавить код в locales + папку _data/<code>/.
i18n:
  structure: multiple_folders
  locales: [uz, en, ru]
  default_locale: uz
  omit_default_locale_from_file_path: false

collections:
  # NB: строки интерфейса страниц (заголовки секций, кнопки) хранятся в
  # _data/<locale>/ui.yml и правятся напрямую. В CMS они не заведены намеренно:
  # неполное описание всех полей привело бы к перезаписи файла при сохранении.

  # ---- Направления: контент страницы (переводимый) ----
  # ВАЖНО: список (widget: list), НЕ объект. Раньше здесь было 5 top-level
  # object-полей (climate/water/.../demography, widget: object) — в Sveltia
  # CMS верхнеуровневый object-виджет в file-коллекции не показывает вкладки
  # языков (проверено на практике, несмотря на то что по документации
  # i18n для object вроде бы поддерживается). List — тот же паттерн, что и
  # у leaders/press/essays/authors ниже, там всё отображается корректно.
  # Каждый элемент списка привязан к _directions/*.md через поле slug.
  - name: directions_text
    label: "Йўналишлар — контент"
    i18n: true
    files:
      - name: directions_text
        label: "Йўналиш саҳифалари: сарлавҳа, статистика, матн, диаграммалар, сценарийлар, тавсиялар"
        file: "_data/{{locale}}/directions.yml"
        i18n: true
        fields:
          - name: directions
            label: "Йўналишлар"
            label_singular: "Йўналиш"
            widget: list
            i18n: true
            summary: "{{fields.title}}"
            fields:
              - { name: slug, label: "Слаг (_directions/*.md файл номи — ЎЗГАРТИРМАНГ)", widget: select, options: ["climate", "water", "energy", "transport", "demography"], i18n: duplicate }
              - { name: title, label: "Сарлавҳа (саҳифа ва меню учун)", widget: string, i18n: true }
              - { name: subtitle, label: "Қисқа тавсиф (heroда, ихтиёрий)", widget: string, required: false, i18n: true }
              - name: stats
                label: "Асосий кўрсаткичлар"
                label_singular: "Кўрсаткич"
                widget: list
                required: false
                i18n: true
                summary: "{{fields.value}} — {{fields.label}}"
                fields:
                  - { name: value, label: "Қиймат (мас: -30%)", widget: string, i18n: duplicate }
                  - { name: label, label: "Изоҳ", widget: string, i18n: true }
              - { name: intro, label: "Кириш матни (2-3 абзац)", widget: text, required: false, i18n: true }
              - name: charts
                label: "Диаграммалар"
                label_singular: "Диаграмма"
                widget: list
                required: false
                i18n: true
                summary: "{{fields.caption}}"
                fields:
                  - { name: image, label: "Расм", widget: image, media_folder: "/assets/images/uploads", public_folder: "/assets/images/uploads", i18n: duplicate }
                  - { name: caption, label: "Подпись", widget: string, i18n: true }
                  - { name: note, label: "Қисқа хулоса", widget: text, required: false, i18n: true }
              - name: scenarios
                label: "2050 йилгача сценарийлар"
                label_singular: "Сценарий"
                widget: list
                required: false
                i18n: true
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: "Номи", widget: string, i18n: true }
                  - { name: description, label: "Тавсиф", widget: text, i18n: true }
                  - { name: outcome, label: "Асосий кўрсаткич / якуний натижа", widget: string, required: false, i18n: true }
              - name: recommendations
                label: "Тавсиялар"
                label_singular: "Тавсия"
                widget: list
                required: false
                i18n: true
                summary: "{{fields.text}}"
                fields:
                  - { name: text, label: "Матн", widget: text, i18n: true }

  # ---- Направления: структура (порядок, иконка) — не переводится ----
  - name: directions_meta
    label: "Йўналишлар — структура"
    folder: "_directions"
    create: true
    extension: md
    format: yaml-frontmatter
    identifier_field: title
    fields:
      - { name: layout, label: "Layout", widget: hidden, default: direction }
      - { name: title, label: "SEO-заголовок", widget: string }
      - { name: order, label: "Порядок", widget: number, value_type: int, default: 99 }
      - { name: icon, label: "SVG-иконка (path d)", widget: string }

  # ---- Авторы книги ----
  - name: authors
    label: "Муаллифлар"
    i18n: true
    files:
      - name: authors
        label: "Китоб муаллифлари"
        file: "_data/{{locale}}/authors.yml"
        i18n: true
        fields:
          - name: authors
            label: "Авторы"
            label_singular: "Автор"
            widget: list
            i18n: true
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: "ФИО", widget: string, i18n: true }
              - { name: role, label: "Должность", widget: string, i18n: true, required: false }
              - { name: country, label: "Страна", widget: string, i18n: true, required: false }
              - { name: contribution, label: "Вклад в книгу", widget: string, i18n: true, required: false }
              - { name: placeholder, label: "Черновик (стиль-заглушка)", widget: boolean, default: false, required: false, i18n: duplicate }

  # ---- Страница «Китоб ҳақида» ----
  - name: about_page
    label: "Китоб ҳақида"
    i18n: true
    files:
      - name: about_intro
        label: "Блок: инфо о книге"
        file: "_data/{{locale}}/about.yml"
        i18n: true
        fields:
          - { name: intro, label: "Абзацы", widget: list, i18n: true, field: { name: text, label: "Абзац", widget: text } }
      - name: agencies
        label: "Блок: организаторы"
        file: "_data/{{locale}}/agencies.yml"
        i18n: true
        fields:
          - name: agencies
            label: "Организаторы"
            label_singular: "Организация"
            widget: list
            i18n: true
            summary: "{{fields.name}}"
            fields:
              - { name: logo, label: "Логотип", widget: image, required: false, media_folder: "/assets/images/uploads", public_folder: "/assets/images/uploads", i18n: duplicate }
              - { name: name, label: "Название", widget: string, i18n: true }

  # ---- Пресса о семинаре ----
  - name: press
    label: "Пресса о семинаре"
    i18n: true
    files:
      - name: press
        label: "ОАВ нигоҳида"
        file: "_data/{{locale}}/press.yml"
        i18n: true
        fields:
          - name: press
            label: "Материалы"
            label_singular: "Материал"
            widget: list
            i18n: true
            summary: "{{fields.source}} — {{fields.title}}"
            fields:
              - { name: source, label: "Издание", widget: string, i18n: duplicate }
              - { name: type, label: "Тип", widget: select, options: ["article", "youtube", "telegram"], default: article, i18n: duplicate }
              - { name: title, label: "Заголовок", widget: string, i18n: true }
              - { name: date, label: "Дата", widget: string, required: false, i18n: duplicate }
              - { name: url, label: "URL", widget: string, i18n: duplicate }

  # ---- Регион ----
  - name: region
    label: "Бир минтақа"
    i18n: true
    files:
      - name: leaders
        label: "Раҳбарлар фикри"
        file: "_data/{{locale}}/leaders.yml"
        i18n: true
        fields:
          - name: leaders
            label: "Раҳбарлар"
            label_singular: "Раҳбар"
            widget: list
            i18n: true
            summary: "{{fields.country}} — {{fields.name}}"
            fields:
              - { name: photo, label: "Фото (крупно)", widget: image, required: false, media_folder: "/assets/images/uploads", public_folder: "/assets/images/uploads", i18n: duplicate }
              - { name: flag, label: "Флаг (маленький)", widget: image, required: false, media_folder: "/assets/images/uploads", public_folder: "/assets/images/uploads", i18n: duplicate }
              - { name: quote, label: "Цитата", widget: text, i18n: true }
              - { name: name, label: "Имя президента", widget: string, i18n: true }
              - { name: position, label: "Должность (полностью, с названием страны — одной строкой, напр. «Ўзбекистон Республикаси Президенти»)", widget: string, i18n: true }
              - { name: country, label: "Страна (только для флага-переключателя выше — под цитатой не выводится)", widget: string, i18n: true }
              - { name: order, label: "Порядок", widget: number, value_type: int, default: 99, i18n: duplicate }
      - name: integration_news
        label: "Интеграция: янгиликлар"
        file: "_data/{{locale}}/integration_news.yml"
        i18n: true
        fields:
          - name: news
            label: "Новости"
            label_singular: "Новость"
            widget: list
            i18n: true
            summary: "{{fields.title}}"
            fields:
              - { name: image, label: "Фото / обложка", widget: image, required: false, media_folder: "/assets/images/uploads", public_folder: "/assets/images/uploads", i18n: duplicate }
              - { name: title, label: "Заголовок", widget: string, i18n: true }
              - { name: description, label: "Краткое описание", widget: text, required: false, i18n: true }
              - { name: url, label: "Ссылка на новость", widget: string, i18n: duplicate }
              - { name: date, label: "Дата", widget: datetime, i18n: duplicate }
              - { name: source, label: "Источник", widget: string, required: false, i18n: duplicate }

  # ---- Ёшлар эсселари ----
  - name: essays
    label: "Ёшлар эсселари"
    i18n: true
    files:
      - name: essays
        label: "Сборник эссе"
        file: "_data/{{locale}}/essays.yml"
        i18n: true
        fields:
          - name: essays
            label: "Эссе"
            widget: list
            i18n: true
            summary: "{{fields.title}} — {{fields.author}}"
            fields:
              - { name: title, label: "Заголовок", widget: string, i18n: true }
              - { name: author, label: "Автор", widget: string, required: false, i18n: duplicate }
              - { name: country, label: "Страна", widget: string, required: false, i18n: true }
              - { name: url, label: "Ссылка", widget: string, required: false, i18n: duplicate }
              - { name: excerpt, label: "Отрывок", widget: text, required: false, i18n: true }
