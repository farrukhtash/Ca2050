# Sveltia CMS configuration — CA2050 (Jekyll + jekyll-polyglot)
# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Аутентификация: один пользователь через Personal Access Token (PAT).
# На экране входа — «Sign in with Token», fine-grained PAT с правом
# Contents: Read and write к farrukhtash/Ca2050. Без Cloudflare Worker.

backend:
  name: github
  repo: farrukhtash/Ca2050
  branch: main

site_url: https://ca2050.uz
display_url: https://ca2050.uz

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

# ── Нативная i18n Sveltia ──────────────────────────────────────
# Каждая локаль хранится в своей папке: _data/<locale>/<name>.yml.
# В редакторе языки переключаются вкладками. Дефолт (uz) — в _data/uz/.
# Добавление локали: добавить код в locales + папку _data/<code>/.
i18n:
  structure: multiple_folders
  locales: [uz, en, ru]
  default_locale: uz
  omit_default_locale_from_file_path: false

collections:
  # ---- Интерфейс матнлари (заголовки секций, eyebrow, тугмалар, плейсхолдерлар) ----
  - name: ui_text
    label: "Интерфейс матнлари"
    i18n: true
    files:
      - name: ui_text
        label: "Сайт бўйлаб интерфейс матнлари (nav, hero, тугмалар, плейсхолдерлар)"
        file: "_data/{{locale}}/ui.yml"
        i18n: true
        fields:
          - { name: brand_name, label: "Сайт номи (логотип ёнида, header/footer)", widget: string, i18n: true }
          - { name: brand_tagline, label: "Сайт остки сарлавҳаси (tagline)", widget: string, i18n: true }
          - { name: footer, label: "Футер матни (асосий, семинар саҳифасидан ташқари)", widget: string, i18n: true }
          - name: nav
            label: "Бош меню (header)"
            widget: object
            i18n: true
            fields:
              - { name: about, label: "Меню: «Китоб ҳақида»", widget: string, i18n: true }
              - { name: directions, label: "Меню: «Йўналишлар» (дропдаун тугмаси)", widget: string, i18n: true }
              - { name: all_directions, label: "Меню: «Барча йўналишлар» (эски майдон, ҳозир фойдаланилмайди)", widget: string, required: false, i18n: true }
              - { name: youth, label: "Меню: «Кейинги авлод гапиради»", widget: string, i18n: true }
              - { name: region, label: "Меню: «Бир минтақа»", widget: string, i18n: true }
              - { name: seminar, label: "Меню: «Форсайт-семинар»", widget: string, i18n: true }
              - { name: feedback, label: "Меню: «Фикрингизни қолдиринг»", widget: string, i18n: true }
          - name: home
            label: "Бош саҳифа"
            widget: object
            i18n: true
            fields:
              - { name: hero_eyebrow, label: "Hero: eyebrow (кичик ёрлиқ)", widget: string, i18n: true }
              - { name: hero_title, label: "Hero: сарлавҳа (H1)", widget: string, i18n: true }
              - { name: hero_sub, label: "Hero: остки матн", widget: text, i18n: true }
              - { name: hero_cta, label: "Hero: тугма («Китобни юклаб олиш»)", widget: string, i18n: true }
              - { name: hero_meta, label: "Hero: кичик изоҳ (217 бет · PDF ...)", widget: string, i18n: true }
              - { name: more, label: "Умумий: «Батафсил →» ҳавола матни", widget: string, i18n: true }
              - { name: about_eyebrow, label: "«Китоб ҳақида» блоки: eyebrow", widget: string, i18n: true }
              - { name: about_h2, label: "«Китоб ҳақида» блоки: сарлавҳа", widget: string, i18n: true }
              - { name: about_p, label: "«Китоб ҳақида» блоки: матн", widget: text, i18n: true }
              - { name: themes_eyebrow, label: "Йўналишлар блоки: eyebrow", widget: string, i18n: true }
              - { name: themes_h2, label: "Йўналишлар блоки: сарлавҳа", widget: string, i18n: true }
              - { name: themes_all, label: "Йўналишлар блоки: «Барча йўналишлар →» ҳавола", widget: string, i18n: true }
              - { name: youth_eyebrow, label: "Ёшлар блоки: eyebrow", widget: string, i18n: true }
              - { name: youth_h2, label: "Ёшлар блоки: сарлавҳа", widget: string, i18n: true }
              - { name: youth_p, label: "Ёшлар блоки: матн", widget: text, i18n: true }
              - { name: youth_tags, label: "Ёшлар блоки: теглар рўйхати", widget: list, i18n: true }
              - { name: seminar_eyebrow, label: "Семинар блоки: eyebrow", widget: string, i18n: true }
              - { name: seminar_h2, label: "Семинар блоки: сарлавҳа", widget: string, i18n: true }
              - { name: seminar_p, label: "Семинар блоки: матн", widget: text, i18n: true }
              - { name: seminar_cta, label: "Семинар блоки: ҳавола матни", widget: string, i18n: true }
              - { name: book_eyebrow, label: "Китоб/CTA блоки: eyebrow", widget: string, i18n: true }
              - { name: book_h2, label: "Китоб/CTA блоки: сарлавҳа", widget: string, i18n: true }
              - { name: book_p, label: "Китоб/CTA блоки: матн", widget: text, i18n: true }
              - { name: book_cta, label: "Китоб/CTA блоки: тугма («PDF юклаб олиш»)", widget: string, i18n: true }
              - { name: feedback_eyebrow, label: "Алоқа блоки: eyebrow", widget: string, i18n: true }
              - { name: feedback_h2, label: "Алоқа блоки: сарлавҳа", widget: string, i18n: true }
              - { name: feedback_p, label: "Алоқа блоки: матн", widget: text, i18n: true }
              - { name: feedback_cta, label: "Алоқа блоки: тугма («Фикр билдириш»)", widget: string, i18n: true }
          - name: about
            label: "«Китоб ҳақида» саҳифаси"
            widget: object
            i18n: true
            fields:
              - { name: hero_eyebrow, label: "Hero: eyebrow", widget: string, i18n: true }
              - { name: hero_title, label: "Hero: сарлавҳа", widget: string, i18n: true }
              - { name: hero_sub, label: "Hero: остки матн", widget: text, i18n: true }
              - { name: overview_eyebrow, label: "Умумий маълумот блоки: eyebrow", widget: string, i18n: true }
              - { name: overview_h2, label: "Умумий маълумот блоки: сарлавҳа", widget: string, i18n: true }
              - { name: agencies_eyebrow, label: "Ташкилотчилар блоки: eyebrow", widget: string, i18n: true }
              - { name: agencies_h2, label: "Ташкилотчилар блоки: сарлавҳа", widget: string, i18n: true }
          - name: directions
            label: "Йўналишлар саҳифалари (рўйхат ва ҳар бир йўналиш)"
            widget: object
            i18n: true
            fields:
              - { name: hero_eyebrow, label: "Рўйхат саҳифаси: hero eyebrow", widget: string, i18n: true }
              - { name: hero_title, label: "Рўйхат саҳифаси: hero сарлавҳа", widget: string, i18n: true }
              - { name: hero_sub, label: "Рўйхат саҳифаси: hero матни", widget: text, i18n: true }
              - { name: card_more, label: "Рўйхат саҳифаси: карточка «Батафсил →» матни", widget: string, i18n: true }
              - { name: detail_eyebrow, label: "Йўналиш саҳифаси: eyebrow", widget: string, i18n: true }
              - { name: back, label: "Йўналиш саҳифаси: «← Барча йўналишлар» ҳаволаси", widget: string, i18n: true }
              - { name: placeholder, label: "Йўналиш саҳифаси: контент бўш бўлганда чиқадиган изоҳ", widget: string, i18n: true }
              - { name: intro_eyebrow, label: "Йўналиш саҳифаси: кириш блоки eyebrow", widget: string, i18n: true }
              - { name: charts_eyebrow, label: "Йўналиш саҳифаси: диаграммалар блоки eyebrow", widget: string, i18n: true }
              - { name: charts_h2, label: "Йўналиш саҳифаси: диаграммалар блоки сарлавҳаси", widget: string, i18n: true }
              - { name: chart_open_label, label: "Диаграмма: катталаштириш тугмаси (aria-label)", widget: string, i18n: true }
              - { name: lightbox_close_label, label: "Lightbox: ёпиш тугмаси (aria-label)", widget: string, i18n: true }
              - { name: scenarios_eyebrow, label: "Сценарийлар блоки: eyebrow", widget: string, i18n: true }
              - { name: scenarios_h2, label: "Сценарийлар блоки: сарлавҳаси", widget: string, i18n: true }
              - { name: recommendations_eyebrow, label: "Тавсиялар блоки: eyebrow", widget: string, i18n: true }
              - { name: recommendations_h2, label: "Тавсиялар блоки: сарлавҳаси", widget: string, i18n: true }
              - { name: nav_prev, label: "Пагинация: «Олдинги йўналиш» ёрлиғи", widget: string, i18n: true }
              - { name: nav_next, label: "Пагинация: «Кейинги йўналиш» ёрлиғи", widget: string, i18n: true }
          - name: youth
            label: "«Кейинги авлод гапиради» саҳифаси"
            widget: object
            i18n: true
            fields:
              - { name: intro_eyebrow, label: "Ғоя блоки: eyebrow", widget: string, i18n: true }
              - { name: intro_h2, label: "Ғоя блоки: сарлавҳа", widget: string, i18n: true }
              - { name: intro_p, label: "Ғоя блоки: матн", widget: text, i18n: true }
              - { name: intro_tags, label: "Ғоя блоки: теглар рўйхати", widget: list, i18n: true }
              - { name: essays_eyebrow, label: "Эсселар блоки: eyebrow", widget: string, i18n: true }
              - { name: essays_h2, label: "Эсселар блоки: сарлавҳа", widget: string, i18n: true }
              - { name: essays_placeholder, label: "Эсселар блоки: контент бўш бўлганда чиқадиган изоҳ", widget: text, i18n: true }
          - name: region
            label: "«Бир минтақа» саҳифаси"
            widget: object
            i18n: true
            fields:
              - { name: hero_eyebrow, label: "Hero: eyebrow", widget: string, i18n: true }
              - { name: hero_title, label: "Hero: сарлавҳа", widget: string, i18n: true }
              - { name: hero_sub, label: "Hero: остки матн", widget: text, i18n: true }
              - { name: leaders_eyebrow, label: "Давлат раҳбарлари блоки: eyebrow", widget: string, i18n: true }
              - { name: leaders_h2, label: "Давлат раҳбарлари блоки сарлавҳаси", widget: string, i18n: true }
              - { name: leaders_placeholder, label: "Давлат раҳбарлари блоки: контент бўш бўлганда чиқадиган изоҳ", widget: text, i18n: true }
              - { name: integration_eyebrow, label: "Интеграция янгиликлари блоки: eyebrow", widget: string, i18n: true }
              - { name: integration_h2, label: "Интеграция янгиликлари блоки: сарлавҳаси", widget: string, i18n: true }
              - { name: integration_placeholder, label: "Интеграция янгиликлари блоки: контент бўш бўлганда чиқадиган изоҳ", widget: text, i18n: true }

  # ---- Направления: контент страницы (переводимый) ----
  # ВАЖНО: список (widget: list), НЕ объект. Раньше здесь было 5 top-level
  # object-полей (climate/water/.../demography, widget: object), и в CMS они
  # не показывали вкладки языков на практике. Отдельная точечная проверка
  # (изолированный конфиг с тестовым backend) позже показала, что object +
  # i18n:true — включая ту же вложенность с list внутри и тот же YAML-якорь —
  # в текущей версии Sveltia отображается корректно; точную причину прежнего
  # сбоя (кэш конфига в браузере на момент проверки? другая версия сборки?)
  # установить не удалось. Раз список ниже уже подтверждённо работает в
  # продакшене — оставлен как есть, вместо повторного риска. См. также
  # ui_text выше: там используется object per-секция, т.к. изолированная
  # проверка подтвердила его надёжность для новой коллекции.
  - name: directions_text
    label: "Йўналишлар — контент"
    i18n: true
    files:
      - name: directions_text
        label: "Йўналиш саҳифалари: сарлавҳа, статистика, матн, диаграммалар, сценарийлар, тавсиялар"
        file: "_data/{{locale}}/directions.yml"
        i18n: true
        fields:
          - name: directions
            label: "Йўналишлар"
            label_singular: "Йўналиш"
            widget: list
            i18n: true
            summary: "{{fields.title}}"
            fields:
              - { name: slug, label: "Слаг (_directions/*.md файл номи — ЎЗГАРТИРМАНГ)", widget: select, options: ["climate", "water", "energy", "transport", "demography"], i18n: duplicate }
              - { name: title, label: "Сарлавҳа (саҳифа ва меню учун)", widget: string, i18n: true }
              - { name: subtitle, label: "Қисқа тавсиф (heroда, ихтиёрий)", widget: string, required: false, i18n: true }
              - name: stats
                label: "Асосий кўрсаткичлар"
                label_singular: "Кўрсаткич"
                widget: list
                required: false
                i18n: true
                summary: "{{fields.value}} — {{fields.label}}"
                fields:
                  - { name: value, label: "Қиймат (мас: -30%)", widget: string, i18n: duplicate }
                  - { name: label, label: "Изоҳ", widget: string, i18n: true }
              - { name: intro, label: "Кириш матни (2-3 абзац)", widget: text, required: false, i18n: true }
              - name: charts
                label: "Диаграммалар"
                label_singular: "Диаграмма"
                widget: list
                required: false
                i18n: true
                summary: "{{fields.caption}}"
                fields:
                  - { name: image, label: "Расм", widget: image, media_folder: "/assets/images/uploads", public_folder: "/assets/images/uploads", i18n: duplicate }
                  - { name: caption, label: "Подпись", widget: string, i18n: true }
                  - { name: note, label: "Қисқа хулоса", widget: text, required: false, i18n: true }
              - name: scenarios
                label: "2050 йилгача сценарийлар"
                label_singular: "Сценарий"
                widget: list
                required: false
                i18n: true
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: "Номи", widget: string, i18n: true }
                  - { name: description, label: "Тавсиф", widget: text, i18n: true }
                  - { name: outcome, label: "Асосий кўрсаткич / якуний натижа", widget: string, required: false, i18n: true }
              - name: recommendations
                label: "Тавсиялар"
                label_singular: "Тавсия"
                widget: list
                required: false
                i18n: true
                summary: "{{fields.text}}"
                fields:
                  - { name: text, label: "Матн", widget: text, i18n: true }

  # ---- Направления: структура (порядок, иконка) — не переводится ----
  - name: directions_meta
    label: "Йўналишлар — структура"
    folder: "_directions"
    create: true
    extension: md
    format: yaml-frontmatter
    identifier_field: title
    fields:
      - { name: layout, label: "Layout", widget: hidden, default: direction }
      - { name: title, label: "SEO-заголовок", widget: string }
      - { name: order, label: "Порядок", widget: number, value_type: int, default: 99 }
      - { name: icon, label: "SVG-иконка (path d)", widget: string }

  # ---- Авторы книги ----
  - name: authors
    label: "Муаллифлар"
    i18n: true
    files:
      - name: authors
        label: "Китоб муаллифлари"
        file: "_data/{{locale}}/authors.yml"
        i18n: true
        fields:
          - { name: eyebrow, label: "Надзаголовок (eyebrow)", widget: string, i18n: true }
          - { name: title, label: "Бўлим сарлавҳаси", widget: string, i18n: true }
          - name: authors
            label: "Авторы"
            label_singular: "Автор"
            widget: list
            i18n: true
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: "ФИО", widget: string, i18n: true }
              - { name: role, label: "Должность", widget: string, i18n: true, required: false }
              - { name: country, label: "Страна", widget: string, i18n: true, required: false }
              - { name: contribution, label: "Вклад в книгу", widget: string, i18n: true, required: false }
              - { name: placeholder, label: "Черновик (стиль-заглушка)", widget: boolean, default: false, required: false, i18n: duplicate }

  # ---- Страница «Китоб ҳақида» ----
  - name: about_page
    label: "Китоб ҳақида"
    i18n: true
    files:
      - name: about_intro
        label: "Блок: инфо о книге"
        file: "_data/{{locale}}/about.yml"
        i18n: true
        fields:
          - { name: intro, label: "Абзацы", widget: list, i18n: true, field: { name: text, label: "Абзац", widget: text } }
      - name: agencies
        label: "Блок: организаторы"
        file: "_data/{{locale}}/agencies.yml"
        i18n: true
        fields:
          - name: agencies
            label: "Организаторы"
            label_singular: "Организация"
            widget: list
            i18n: true
            summary: "{{fields.name}}"
            fields:
              - { name: logo, label: "Логотип", widget: image, required: false, media_folder: "/assets/images/uploads", public_folder: "/assets/images/uploads", i18n: duplicate }
              - { name: name, label: "Название", widget: string, i18n: true }
      - name: gratitude
        label: "Блок: благодарности"
        file: "_data/{{locale}}/gratitude.yml"
        i18n: true
        fields:
          - { name: eyebrow, label: "Надзаголовок (eyebrow)", widget: string, required: false, i18n: true }
          - { name: title, label: "Заголовок секции", widget: string, required: false, i18n: true }
          - { name: text, label: "Текст (несколько абзацев)", widget: text, required: false, i18n: true }

  # ---- Форсайт-семинар (саҳифа контенти, бир коллекцияда) ----
  # Паттерн region/about_page/youth_content кабидек — фақат widget:
  # list/string/text (object-виджет ва YAML-якор ЙЎҚ, directions_text'даги
  # муаммони такрорламаслик учун). Бутун /seminar-2025/ саҳифаси — hero,
  # «Семинар ҳақида», иқтибослар, медиатека, ОАВ, якуний блок — шу битта
  # коллекциядан бошқарилади (олдин фақат ОАВ блоки таҳрирланарди, қолгани
  # ui.yml'да эди — энди ҳаммаси бирга).
  - name: seminar_page
    label: "Форсайт-семинар — саҳифа контенти"
    i18n: true
    files:
      - name: seminar_page
        label: "Семинар саҳифаси: hero, семинар ҳақида, иқтибослар, медиатека, ОАВ, якуний блок"
        file: "_data/{{locale}}/seminar.yml"
        i18n: true
        fields:
          - { name: hero_eyebrow, label: "Hero: eyebrow", widget: string, i18n: true }
          - { name: hero_title, label: "Hero: сарлавҳа", widget: string, i18n: true }
          - { name: hero_dates, label: "Hero: тадбир саналари", widget: string, i18n: true }
          - { name: hero_organizers, label: "Hero: ташкилотчилар қатори", widget: text, i18n: true }
          - { name: about_eyebrow, label: "«Семинар ҳақида» блоки: eyebrow", widget: string, i18n: true }
          - { name: about_h2, label: "«Семинар ҳақида» блоки: сарлавҳа", widget: string, i18n: true }
          - name: about_paragraphs
            label: "«Семинар ҳақида» блоки: абзацлар"
            label_singular: "Абзац"
            widget: list
            i18n: true
            summary: "{{fields.text}}"
            fields:
              - { name: text, label: "Матн", widget: text, i18n: true }
          - { name: quotes_eyebrow, label: "Иштирокчилар фикри блоки: eyebrow", widget: string, i18n: true }
          - { name: quotes_h2, label: "Иштирокчилар фикри блоки: сарлавҳа", widget: string, i18n: true }
          - name: quotes
            label: "Иштирокчилар иқтибослари"
            label_singular: "Иқтибос"
            widget: list
            i18n: true
            summary: "{{fields.name}}"
            fields:
              - { name: photo, label: "Спикер фотоси", widget: image, required: false, media_folder: "/assets/images/uploads", public_folder: "/assets/images/uploads", i18n: duplicate }
