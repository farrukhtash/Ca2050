# Sveltia CMS configuration — CA2050 (Jekyll + jekyll-polyglot)
# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Аутентификация: один пользователь через Personal Access Token (PAT).
# На экране входа — «Sign in with Token», fine-grained PAT с правом
# Contents: Read and write к farrukhtash/Ca2050. Без Cloudflare Worker.

backend:
  name: github
  repo: farrukhtash/Ca2050
  branch: main

site_url: https://ca2050.uz
display_url: https://ca2050.uz

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

# ── Нативная i18n Sveltia ──────────────────────────────────────
# Каждая локаль хранится в своей папке: _data/<locale>/<name>.yml.
# В редакторе языки переключаются вкладками. Дефолт (uz) — в _data/uz/.
# Добавление локали: добавить код в locales + папку _data/<code>/.
i18n:
  structure: multiple_folders
  locales: [uz, en, ru]
  default_locale: uz
  omit_default_locale_from_file_path: false

collections:
  # NB: строки интерфейса страниц (заголовки секций, кнопки) хранятся в
  # _data/<locale>/ui.yml и правятся напрямую. В CMS они не заведены намеренно:
  # неполное описание всех полей привело бы к перезаписи файла при сохранении.

  # ---- Направления: заголовки (переводимые) ----
  - name: directions_text
    label: "Йўналишлар — заголовки"
    files:
      - name: directions_text
        label: "Названия направлений"
        file: "_data/{{locale}}/directions.yml"
        i18n: true
        fields:
          - { name: climate, label: "Иқлим", widget: object, i18n: true, fields: [{ name: title, label: "Заголовок", widget: string, i18n: true }] }
          - { name: water, label: "Сув", widget: object, i18n: true, fields: [{ name: title, label: "Заголовок", widget: string, i18n: true }] }
          - { name: energy, label: "Энергетика", widget: object, i18n: true, fields: [{ name: title, label: "Заголовок", widget: string, i18n: true }] }
          - { name: transport, label: "Транспорт", widget: object, i18n: true, fields: [{ name: title, label: "Заголовок", widget: string, i18n: true }] }
          - { name: demography, label: "Демография", widget: object, i18n: true, fields: [{ name: title, label: "Заголовок", widget: string, i18n: true }] }

  # ---- Направления: структура (порядок, иконка) — не переводится ----
  - name: directions_meta
    label: "Йўналишлар — структура"
    folder: "_directions"
    create: true
    extension: md
    format: yaml-frontmatter
    identifier_field: title
    fields:
      - { name: layout, label: "Layout", widget: hidden, default: direction }
      - { name: title, label: "SEO-заголовок", widget: string }
      - { name: order, label: "Порядок", widget: number, value_type: int, default: 99 }
      - { name: icon, label: "SVG-иконка (path d)", widget: string }

  # ---- Авторы книги ----
  - name: authors
    label: "Муаллифлар"
    files:
      - name: authors
        label: "Китоб муаллифлари"
        file: "_data/{{locale}}/authors.yml"
        i18n: true
        fields:
          - name: authors
            label: "Авторы"
            label_singular: "Автор"
            widget: list
            i18n: true
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: "ФИО", widget: string, i18n: true }
              - { name: role, label: "Должность", widget: string, i18n: true, required: false }
              - { name: country, label: "Страна", widget: string, i18n: true, required: false }
              - { name: contribution, label: "Вклад в книгу", widget: string, i18n: true, required: false }
              - { name: placeholder, label: "Черновик (стиль-заглушка)", widget: boolean, default: false, required: false, i18n: duplicate }

  # ---- Страница «Китоб ҳақида» ----
  - name: about_page
    label: "Китоб ҳақида"
    files:
      - name: about_intro
        label: "Блок: инфо о книге"
        file: "_data/{{locale}}/about.yml"
        i18n: true
        fields:
          - { name: intro, label: "Абзацы", widget: list, i18n: true, field: { name: text, label: "Абзац", widget: text } }
          - { name: quote, label: "Цитата", widget: text, i18n: true }
          - { name: quote_cite, label: "Подпись цитаты", widget: string, i18n: true }
      - name: agencies
        label: "Блок: агентства"
        file: "_data/{{locale}}/agencies.yml"
        i18n: true
        fields:
          - { name: support, label: "Строка поддержки", widget: string, i18n: true }
          - name: agencies
            label: "Агентства"
            widget: list
            i18n: true
            summary: "{{fields.short}} — {{fields.name}}"
            fields:
              - { name: short, label: "Краткое название", widget: string, i18n: true }
              - { name: name, label: "Полное название", widget: string, i18n: true }

  # ---- Пресса о семинаре ----
  - name: press
    label: "Пресса о семинаре"
    files:
      - name: press
        label: "ОАВ нигоҳида"
        file: "_data/{{locale}}/press.yml"
        i18n: true
        fields:
          - name: press
            label: "Материалы"
            label_singular: "Материал"
            widget: list
            i18n: true
            summary: "{{fields.source}} — {{fields.title}}"
            fields:
              - { name: source, label: "Издание", widget: string, i18n: duplicate }
              - { name: type, label: "Тип", widget: select, options: ["article", "youtube", "telegram"], default: article, i18n: duplicate }
              - { name: title, label: "Заголовок", widget: string, i18n: true }
              - { name: date, label: "Дата", widget: string, required: false, i18n: duplicate }
              - { name: url, label: "URL", widget: string, i18n: duplicate }

  # ---- Регион ----
  - name: region
    label: "Беш давлат — бир минтақа"
    files:
      - name: leaders
        label: "Раҳбарлар фикри"
        file: "_data/{{locale}}/leaders.yml"
        i18n: true
        fields:
          - name: leaders
            label: "Высказывания"
            widget: list
            i18n: true
            summary: "{{fields.country}}"
            fields:
              - { name: country, label: "Страна", widget: string, i18n: true }
              - { name: quote, label: "Цитата", widget: text, i18n: true }
      - name: integration_news
        label: "Интеграция: янгиликлар"
        file: "_data/{{locale}}/integration_news.yml"
        i18n: true
        fields:
          - name: news
            label: "Новости"
            widget: list
            i18n: true
            fields:
              - { name: text, label: "Текст", widget: text, i18n: true }
              - { name: url, label: "Ссылка", widget: string, required: false, i18n: duplicate }

  # ---- Ёшлар эсселари ----
  - name: essays
    label: "Ёшлар эсселари"
    files:
      - name: essays
        label: "Сборник эссе"
        file: "_data/{{locale}}/essays.yml"
        i18n: true
        fields:
          - name: essays
            label: "Эссе"
            widget: list
            i18n: true
            summary: "{{fields.title}} — {{fields.author}}"
            fields:
              - { name: title, label: "Заголовок", widget: string, i18n: true }
              - { name: author, label: "Автор", widget: string, required: false, i18n: duplicate }
              - { name: country, label: "Страна", widget: string, required: false, i18n: true }
              - { name: url, label: "Ссылка", widget: string, required: false, i18n: duplicate }
              - { name: excerpt, label: "Отрывок", widget: text, required: false, i18n: true }
